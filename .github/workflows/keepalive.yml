# Keeps the Render free instance awake (it spins down after 15 min idle) and
# keeps the Neon connection warm. Scheduled crons may drift a few minutes; that
# is fine — one hit inside every 15-minute window is all that is needed.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -sf -m 60 https://labby-backend-8j0c.onrender.com/actuator/health
