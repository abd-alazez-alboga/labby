<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate your rider</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59128A}a:hover{color:#3D0B57}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #141018; background: #FFFFFF; display: flex; flex-direction: column; padding: 56px 20px 34px; box-sizing: border-box; gap: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="DriverReportRider.dc.html" style="height: 48px; padding: 0 4px; display: flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 800; color: #59128A;">Report a problem</a>
    <a href="DriverOffline.dc.html" style="height: 48px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 800; color: #463C58;">Skip</a>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 8px;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: #E8DCF0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #59128A;">R</div>
    <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px; text-align: center;">How was Rana as a rider?</span>
    <span style="font-size: 14px; color: #463C58;">Trip ended 12:43 · cash collected</span>
  </div>
  <div role="radiogroup" aria-label="Rating, 1 to 5 stars" style="display: flex; justify-content: center; gap: 8px; padding: 8px 0;">
    <button role="radio" aria-checked="false" aria-label="1 star" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="2 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="3 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="4 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="true" aria-label="5 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
  </div>
  <span style="text-align: center; font-size: 16px; font-weight: 800; margin-top: -8px;">Excellent</span>
  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700; color: #463C58;">Add a comment (optional)
    <textarea rows="3" placeholder="Anything to note?" style="border: 1.5px solid #D9D5DF; border-radius: 14px; padding: 12px 14px; font-family: Manrope, sans-serif; font-size: 15px; color: #141018; resize: none;"></textarea>
  </label>
  <span style="font-size: 13px; color: #463C58; line-height: 1.5;">Anonymous: Rana only sees an overall average.</span>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 56px; border-radius: 14px; border: none; background: #59128A; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800;">Submit and go online</button>
    <span style="text-align: center; font-size: 13px; color: #6E6780;">Skipped? Rate it from Trips until 22 Oct.</span>
  </div>
</div>
</x-dc>
