<html lang="en">
<head>
<meta charset="utf-8">
<title>Demand heatmap</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59128A}a:hover{color:#3D0B57}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #141018; background: #ECE9F0;">
  <div style="position: absolute; left: -40px; top: 200px; width: 520px; height: 18px; background: #FFFFFF; transform: rotate(-12deg);"></div>
  <div style="position: absolute; left: -40px; top: 420px; width: 520px; height: 12px; background: #FFFFFF; transform: rotate(8deg);"></div>
  <div style="position: absolute; left: 120px; top: -40px; width: 14px; height: 760px; background: #FFFFFF; transform: rotate(14deg);"></div>
  <div style="position: absolute; left: 290px; top: -40px; width: 10px; height: 760px; background: #FFFFFF; transform: rotate(-6deg);"></div>

  <div style="position: absolute; left: 22px; top: 128px; width: 196px; height: 170px; background: rgba(89,18,138,0.50); border: 2px solid #59128A; clip-path: polygon(10% 0, 100% 8%, 92% 100%, 0 86%); display: flex; align-items: center; justify-content: center;">
    <span style="background: #59128A; color: #FFFFFF; font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 12px;" dir="ltr">2.0×</span>
  </div>
  <div style="position: absolute; left: 214px; top: 156px; width: 160px; height: 150px; background: rgba(89,18,138,0.28); border: 2px solid rgba(89,18,138,0.7); clip-path: polygon(0 6%, 90% 0, 100% 90%, 8% 100%); display: flex; align-items: center; justify-content: center;">
    <span style="background: #FFFFFF; color: #3D0B57; font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 12px;" dir="ltr">1.5×</span>
  </div>
  <div style="position: absolute; left: 60px; top: 330px; width: 200px; height: 130px; background: rgba(89,18,138,0.12); border: 2px dashed rgba(89,18,138,0.55); clip-path: polygon(4% 0, 100% 12%, 94% 100%, 0 90%); display: flex; align-items: center; justify-content: center;">
    <span style="background: #FFFFFF; color: #463C58; font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 12px;" dir="ltr">1.2×</span>
  </div>
  <div style="position: absolute; left: 236px; top: 470px; width: 30px; height: 30px; border-radius: 50%; background: #141018; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(20,16,24,0.3);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l7 18-7-4-7 4z"></path></svg>
  </div>

  <div style="position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center;">
    <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 2px 10px rgba(20,16,24,0.16); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141018" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <div style="height: 40px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(20,16,24,0.16); font-size: 14px; font-weight: 700;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #12B76A;"></span>
      Online
    </div>
    <button aria-label="Hide demand heatmap" aria-pressed="true" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #59128A; box-shadow: 0 2px 10px rgba(61,11,87,0.35); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 3 21 8 12 13 3 8 12 3"></polygon><polyline points="3 13 12 18 21 13"></polyline></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(20,16,24,0.12); padding: 10px 24px 34px; display: flex; flex-direction: column; gap: 14px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D5DF;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 20px; font-weight: 800;">Demand near you</span>
        <span style="font-size: 13px; color: #463C58;">Updated 12:40 · next update 12:42</span>
      </span>
      <span style="font-size: 13px; font-weight: 700; color: #6E6780;">Damascus</span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #F2F0F5; font-size: 13px; font-weight: 700;">
        <span style="width: 16px; height: 16px; border-radius: 4px; background: rgba(89,18,138,0.12); border: 2px dashed rgba(89,18,138,0.55);"></span>Busy <span dir="ltr">1.2×</span>
      </span>
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #F2F0F5; font-size: 13px; font-weight: 700;">
        <span style="width: 16px; height: 16px; border-radius: 4px; background: rgba(89,18,138,0.28); border: 2px solid rgba(89,18,138,0.7);"></span>Very busy <span dir="ltr">1.5×</span>
      </span>
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #F2F0F5; font-size: 13px; font-weight: 700;">
        <span style="width: 16px; height: 16px; border-radius: 4px; background: rgba(89,18,138,0.5); border: 2px solid #59128A;"></span>Highest <span dir="ltr">2.0×</span>
      </span>
    </div>
    <span style="font-size: 13px; color: #6E6780; line-height: 1.5;">Shaded areas have more ride requests than free drivers, so fares there are higher. Moving there is your choice.</span>
  </div>
</div>
</x-dc>
