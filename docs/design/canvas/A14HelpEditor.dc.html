  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">

        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Edit article</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700; color: #6A2C0A; background: #FFF6E5; padding: 5px 10px; border-radius: 12px;">Draft</span>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #463C58;">Category
            <select style="height: 40px; border: 1.5px solid #D9D5DF; border-radius: 10px; padding: 0 10px; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: #141018; background: #FFFFFF;">

              <option>Rides &amp; booking</option>
              <option>Account &amp; profile</option>
              <option>Safety</option>
            </select>
          </label>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1.5px solid #D9D5DF; background: #FFFFFF; color: #141018; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800;">Save draft</button>
        <button style="height: 48px; padding: 0 20px; border-radius: 12px; border: none; background: #59128A; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; opacity: 0.4;" disabled>Publish</button>

    <div style="display: flex; gap: 12px; align-items: center; background: #FFF6E5; border: 1px solid #F5E3BC; border-radius: 12px; padding: 12px 16px;">

    </div>

    <div style="display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap;">
      <section style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #ECEAF0; border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800;">English</h2>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #463C58;">Title
          <div style="height: 44px; border: 1.5px solid #D9D5DF; border-radius: 10px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 700; color: #141018;">What is a waiting charge?</div>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #463C58; flex-grow: 1;">Body <span style="font-weight: 600; color: #6E6780;">plain text · paragraphs · up to 20,000 characters</span>
          <div style="flex-grow: 1; min-height: 300px; border: 1.5px solid #D9D5DF; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #463C58; font-weight: 400;">When your driver arrives and waits beyond the free waiting time, a per-minute waiting charge is added to your fare.<br><br>You always get a notification the moment the waiting charge starts, and the rate is shown on your receipt.<br><br>The free waiting time and the rate depend on your city.</div>
        </label>
        <span style="font-size: 12px; color: #6E6780;">1,214 characters</span>
      </section>

      <section style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #ECEAF0; border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800;">Arabic · العربية</h2>
        <label dir="rtl" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #463C58; font-family: 'IBM Plex Sans Arabic', sans-serif;">العنوان
          <div style="height: 44px; border: 1.5px solid #D9D5DF; border-radius: 10px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 700; color: #141018;">ما هي رسوم الانتظار؟</div>
        </label>
        <label dir="rtl" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B42318; flex-grow: 1; font-family: 'IBM Plex Sans Arabic', sans-serif;">النص <span style="font-weight: 600;">مطلوب قبل النشر</span>
          <div style="flex-grow: 1; min-height: 300px; border: 1.5px solid #B42318; border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #6E6780; font-weight: 400;">اكتب النص العربي هنا…</div>
        </label>
        <span dir="rtl" style="font-size: 12px; color: #B42318; font-family: 'IBM Plex Sans Arabic', sans-serif;">0 حرف — النص العربي فارغ</span>
      </section>
    </div>
  </main>
