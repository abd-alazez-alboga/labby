<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate your driver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59128A}a:hover{color:#3D0B57}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #141018; background: #FFFFFF; display: flex; flex-direction: column; padding: 56px 20px 34px; box-sizing: border-box; gap: 20px;">
  <div style="display: flex; justify-content: flex-end;">
    <a href="RiderComplete.dc.html" style="height: 48px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 800; color: #463C58;">Skip</a>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 8px;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: #E8DCF0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #59128A;">SK</div>
    <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px; text-align: center;">How was your ride with Samer?</span>
    <span style="font-size: 14px; color: #463C58;">Today 12:43 · Umayyad Square</span>
  </div>

  <div role="radiogroup" aria-label="Rating, 1 to 5 stars" style="display: flex; justify-content: center; gap: 8px; padding: 8px 0;">
    <button role="radio" aria-checked="false" aria-label="1 star" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="2 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="3 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="true" aria-label="4 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="#59128A" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
    <button role="radio" aria-checked="false" aria-label="5 stars" style="width: 56px; height: 56px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#B9B2C4" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.4 5.8 21 7.2 14 2 9.3 8.9 8.6"></polygon></svg></button>
  </div>
  <span style="text-align: center; font-size: 16px; font-weight: 800; margin-top: -8px;">Good</span>

  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700; color: #463C58;">Add a comment (optional)
    <textarea rows="3" placeholder="What stood out?" style="border: 1.5px solid #D9D5DF; border-radius: 14px; padding: 12px 14px; font-family: Manrope, sans-serif; font-size: 15px; color: #141018; resize: none;">Clean car, a little late to pickup.</textarea>
  </label>

  <div style="display: flex; gap: 10px; align-items: flex-start; background: #F2F0F5; border-radius: 14px; padding: 12px 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#463C58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <span style="font-size: 13px; color: #463C58; line-height: 1.5;">Your rating is anonymous. Samer only ever sees an overall average, never who rated or for which ride.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 56px; border-radius: 14px; border: none; background: #59128A; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800;">Submit rating</button>
    <span style="text-align: center; font-size: 13px; color: #6E6780;">You can rate this ride from Your rides until 22 Oct.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
