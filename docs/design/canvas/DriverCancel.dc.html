<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59128A}a:hover{color:#3D0B57}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #141018; background: #DCD8E2;">
  <div style="position: absolute; left: -40px; top: 260px; width: 520px; height: 18px; background: #F4F2F7; transform: rotate(-12deg);"></div>
  <div style="position: absolute; left: 150px; top: -40px; width: 14px; height: 560px; background: #F4F2F7; transform: rotate(14deg);"></div>
  <div style="position: absolute; inset: 0; background: rgba(20,16,24,0.48);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D5DF;"></div>
    <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.4px;">Cancel Rana's ride?</span>
    <span style="font-size: 15px; color: #463C58; margin-top: -6px;">Rana won't be charged, and we'll find another driver for the trip. Cancellations count toward your cancellation rate.</span>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
      <legend style="font-size: 14px; font-weight: 700; color: #463C58; padding: 0 0 6px;">Reason (required)</legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EEEBF2; font-size: 17px; font-weight: 700; color: #6E6780;">
        <input type="radio" name="reason" disabled style="width: 24px; height: 24px; accent-color: #59128A; margin: 0;">
        <span style="display: flex; flex-direction: column; gap: 1px;">
          Rider didn't show up
          <span style="font-size: 13px; font-weight: 600;">Available after 5 min waiting · rider pays the fee</span>
        </span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EEEBF2; font-size: 17px; font-weight: 700;">
        <input type="radio" name="reason" checked style="width: 24px; height: 24px; accent-color: #59128A; margin: 0;">
        Vehicle problem
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EEEBF2; font-size: 17px; font-weight: 700;">
        <input type="radio" name="reason" style="width: 24px; height: 24px; accent-color: #59128A; margin: 0;">
        Pickup point feels unsafe
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 17px; font-weight: 700;">
        <input type="radio" name="reason" style="width: 24px; height: 24px; accent-color: #59128A; margin: 0;">
        Something else
      </label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="DriverToPickup.dc.html" style="height: 64px; border-radius: 16px; background: #59128A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; font-weight: 800;">Keep the ride</a>
      <button style="height: 56px; border-radius: 14px; border: 1.5px solid #B42318; background: #FFFFFF; color: #B42318; font-family: Manrope, sans-serif; font-size: 17px; font-weight: 800;">Cancel ride</button>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
