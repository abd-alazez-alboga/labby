<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a ride with promo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59128A}a:hover{color:#3D0B57}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #141018; background: #E8E6EC; display: flex; flex-direction: column; justify-content: flex-end;">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 400px; background: linear-gradient(180deg, #DEDBE4 0%, #E8E6EC 100%);">
    <svg width="390" height="400" viewBox="0 0 390 400" fill="none" aria-hidden="true"><path d="M60 330 C 140 260, 200 220, 330 90" stroke="#59128A" stroke-width="4" stroke-linecap="round"></path><circle cx="60" cy="330" r="8" fill="#141018"></circle><circle cx="330" cy="90" r="8" fill="#59128A"></circle></svg>
  </div>

  <div style="position: relative; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 18px 20px 34px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 30px rgba(20,16,24,0.12);">
    <div style="width: 44px; height: 4px; border-radius: 2px; background: #D9D5DF; align-self: center;"></div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.4px;">Choose a ride</div>

    <div style="display: flex; align-items: center; gap: 12px; border: 2px solid #59128A; border-radius: 16px; padding: 12px 14px;">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #F1EAF8; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#59128A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5h-11z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800;">Economy</span>
        <span style="font-size: 13px; color: #6E6780;">4 seats · 6 min away</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800;">SYP 27,000</span>
        <span style="font-size: 12px; color: #6E6780;">estimate</span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #ECEAF0; border-radius: 16px; padding: 12px 14px;">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #F2F0F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141018" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5h-11z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800;">Comfort</span>
        <span style="font-size: 13px; color: #6E6780;">4 seats · 9 min away</span>
      </span>
      <span style="font-size: 16px; font-weight: 800;">SYP 38,500</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #F1EAF8; border-radius: 14px; padding: 12px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#59128A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20.6 13.4 11 3.8a2 2 0 0 0-1.4-.6H4a1 1 0 0 0-1 1v5.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"></path><circle cx="7.5" cy="7.5" r="1.2" fill="#59128A" stroke="none"></circle></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 14px; font-weight: 800; color: #3D0B57;">WELCOME20 applied</span>
        <span style="font-size: 12.5px; color: #59128A; line-height: 1.4;">20% off, up to SYP 10,000 — taken off the final fare at the end of the ride.</span>
        <span style="font-size: 12.5px; color: #6E6780;">≈ −SYP 4,400 on this estimate</span>
      </span>
      <button style="border: none; background: none; color: #59128A; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; padding: 10px 4px;">Remove</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; min-height: 48px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141018" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700;">Cash</span>
      <span style="font-size: 13px; font-weight: 700; color: #6E6780;">Change</span>
    </div>

    <button style="height: 56px; border-radius: 16px; border: none; background: #59128A; color: #FFFFFF; font-family: Manrope, sans-serif; font-size: 17px; font-weight: 800;">Book Economy</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
