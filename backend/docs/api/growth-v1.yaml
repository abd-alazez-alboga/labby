openapi: 3.1.0
info:
  title: Labby Growth API (M13 contract)
  version: 0.1.0
  description: >
    Contract-first spec for milestone M13, growth: promo codes, referrals, loyalty points,
    badges / levels and challenges. The clients (M13-T3 rider, M13-T4 driver + admin) build
    against this document; the backend (M13-T2) must implement it exactly — on conflict after T2
    lands, the implementation is the truth and this file is amended. Schema: migration V24.
    SRS: GRW-01..04, GAME-01..03; UC-R-04 A1, UC-R-18/19, UC-S-23/24, UC-A-26/28. Every credit
    lands in the M8 wallet as its typed transaction (`promo`, `referral`, `loyalty_redemption` —
    money-v1 rails, append-only ledgers, PAY-01 currency isolation).


    **Owner money rulings (2026-10-18).**

    (1) **Promos are platform-funded**: the rider pays the discounted total, the driver's
    commission is computed on the PRE-discount fare, and the driver is made whole — the discount
    amount reaches the driver as a platform-funded `promo` wallet credit linked to the ride, so
    driver earnings on a promo ride equal those on the same ride without the promo.

    (2) A promo on a **shared ride** discounts only the redeeming MEMBER'S OWN seat share, applied
    at the completion split (RIDE-P4); other members' shares are untouched.

    (3) A promo on a **scheduled ride** is validated AND reserved (counted against its caps) at
    booking; the discount AMOUNT is computed at ride time against the ride-time price
    (scheduled rides are priced at execution — scheduled-shared-v1). A promo whose window has
    ended by ride time still applies: the reservation at booking is the commitment.

    (4) Referral reward amounts and the loyalty settings (points rate, redemption threshold,
    redemption rate) are **per region, admin-editable** (audited, code defaults): `growth_settings`
    joins the regions-v1 region bundle like `scheduledSettings`.

    (5) **Badges** are the fixed catalog seeded by V24 (10th/50th/100th ride, first shared ride,
    first referral, 5-star week); **levels** are Bronze 0 / Silver 500 / Gold 2,000 /
    Platinum 5,000 lifetime points, never decreasing (redemption spends `redeemable` only).
    5-star week = at least 3 ratings within any rolling 7 days, all of them 5★ (owner-confirmed
    at T2 sign-off, 2026-10-18).

    (6) A referral reward pays at most **once per referee account AND once per phone number,
    ever** (DB-unique; a deleted then reactivated account never retriggers). Self-referral is
    refused. **Suspension freezes accrual and redemption but points are kept.**


    **Promo application (GRW-01/02; amended at T2 — the implementation is the truth).** The
    booking hook: rides-v1 `POST /rides` and the scheduled-shared-v1 schedule / create / join
    requests gain an optional `promoCode` (the ESTIMATE stays promo-free: the app previews the
    discount through `POST /promos/validate` with the chosen option's `estimateTotal`). At booking
    the code is re-validated under the promo row lock and RESERVED as the ride's redemption row;
    caps count reservations whose ride is still alive, so a cancelled / failed ride releases its
    reservation (the row stays as the audit trail) and a retry or driver-cancel redispatch carries
    the promo to the new ride. At completion the discount is computed against the final metered
    total — stored in the fare breakdown's `discount` component, NEVER recomputed, floor at zero,
    applied AFTER extras/surge/surcharge and the minimum-fare floor (stacking order: promo is
    last). One promo per ride, promos never stack (joining with a code when the ride already has
    one → 409 `promo_already_applied`). A shared-ride member who leaves, is dropped at dispatch or
    is marked absent releases their own reservation — caps freed, another member may then apply
    (M13 review H1). One ALIVE first-ride reservation per rider: while a scheduled or live ride
    holds a `first_ride_only` promo, a second flagged code is refused `promo_first_ride_only`
    (M13 review W1, owner ruling 2026-10-19).


    **Referrals (GRW-03).** Each user shares one code (`referral_codes`, created lazily). A new
    account enters a code AT registration (UC-R-18: auth-v1 `POST /auth/register/complete`
    `referralCode`, amended at M13-T5 — the rider app's register step carries the field; the
    `/referrals/enter` endpoint below is the same capture as a standalone primitive, accepted
    until the first completed ride) (capture, status `pending`); on the referee's
    FIRST completed ride both sides receive their region-configured `referral` wallet credit in
    the ride currency, and the row becomes `rewarded` (exactly once). A region configured to pay 0/0 leaves the row
    `pending` — never shown rewarded with nothing paid (M13 review W5, owner ruling 2026-10-19).
    Abuse blocks: self-referral,
    phone-ever uniqueness, suspended accounts don't trigger rewards (status `blocked`).


    **Loyalty (GRW-04).** The redeem request names the region whose rule and currency apply; V1
    deployments are single-currency, so cross-region rate shopping is accepted as moot and no
    server-side region binding is enforced (M13 review W3, owner ruling 2026-10-19). Accrual on
    ride completion: `pointsPerCurrencyUnit` (default 1) × the
    rider's own paid fare — on a shared ride the member's own share. Redemption: at or above the
    region threshold, points convert at the region rate into a `loyalty_redemption` wallet credit
    (traceable via `points_transactions.wallet_transaction_id`). `lifetime` only grows; levels
    derive from it (riders: loyalty earned; drivers: trips + challenge points). Driver-role
    challenge rewards feed the LEVEL only — recorded as points transactions but never entering
    `redeemable` (M13 review W4, owner ruling 2026-10-19).


    **Challenges (GAME-02).** Admin-created per region and role (window, goal, reward points);
    progress tracks live events; completion auto-credits the reward points exactly once; an early
    end (`ended_at`) stops progress but completions already made keep their reward.


    **Cross-feature section for T2** (plan these together): promo × shared seat split (ruling 2),
    promo × scheduled pricing (ruling 3), loyalty accrual on a member's share, referral ×
    suspension (ruling 6), promo + carried dues ordering at completion (promo shrinks the fare
    BEFORE dues are carried on top).


    Errors use the global ErrorResponse shape (status, message, code?, details?). Rider endpoints
    need the rider role; driver badge/challenge reads resolve the caller's driver role; admin
    endpoints are permission-gated — promos by the existing `promos:view` / `promos:manage`
    catalog codes, challenges by the new `challenges:view` / `challenges:manage` (amended at T2
    from the draft's `growth:*`: the RBAC catalog already owned the promos domain) — and audited.
servers:
  - url: http://localhost:8080
tags:
  - name: Promos
  - name: Referrals
  - name: Loyalty
  - name: Gamification
  - name: AdminPromos
  - name: AdminChallenges
  - name: AdminGamification

paths:
  /api/v1/promos/validate:
    post:
      tags: [Promos]
      summary: Validate a promo code before booking (UC-R-04 A1)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidatePromoRequest' }
      responses:
        '200':
          description: Valid now for this context; the discount preview uses the given estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoValidation' }
        '404': { description: '`promo_not_found` — unknown or inactive code' }
        '409': { description: '`promo_window` | `promo_exhausted` | `promo_user_limit` | `promo_first_ride_only` | `promo_wrong_region` | `promo_wrong_service`' }

  /api/v1/referrals/me:
    get:
      tags: [Referrals]
      summary: My referral code, referee statuses and region reward (UC-R-18)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, required: false, schema: { type: string, format: uuid }, description: "When given, the response's `reward` carries this region's referral amounts (404 `region_not_found` for an unknown id); omitted, `reward` is null (amended at T3 sign-off 2026-10-18: the approved referral screen shows the amounts)" }
      responses:
        '200':
          description: The code is created on first read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralStatus' }

  /api/v1/referrals/enter:
    post:
      tags: [Referrals]
      summary: Enter a referral code (once, at/after registration, before any completed ride)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Captured as pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralStatus' }
        '404': { description: '`referral_code_not_found`' }
        '409': { description: '`referral_already_entered` | `referral_self` | `referral_phone_used` | `referral_too_late` (the caller already completed a ride)' }

  /api/v1/loyalty:
    get:
      tags: [Loyalty]
      summary: My points balance, level and the region redemption rule (UC-R-19)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, required: true, schema: { type: string, format: uuid }, description: The region whose redemption rule (threshold, rate, currency) to show }
      responses:
        '200':
          description: Balance and rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalance' }

  /api/v1/loyalty/transactions:
    get:
      tags: [Loyalty]
      summary: My points history, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointsTransactionPage' }

  /api/v1/loyalty/redeem:
    post:
      tags: [Loyalty]
      summary: Redeem points into a wallet credit (UC-R-19)
      description: >
        `points` must be at least the region threshold and at most the redeemable balance; the
        credit is `points × redemptionRate` in the region currency, one `loyalty_redemption`
        wallet transaction, linked back from the points transaction. Refused while suspended
        (ruling 6).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regionId, points]
              properties:
                regionId: { type: string, format: uuid }
                points: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Credited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalance' }
        '403': { description: '`account_suspended`' }
        '409': { description: '`below_threshold` (details.thresholdPoints) | `insufficient_points` (details.redeemable)' }

  /api/v1/gamification/me:
    get:
      tags: [Gamification]
      summary: My badges and level (UC-S-23/24; rider or driver view via `as`)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: as, in: query, required: true, schema: { type: string, enum: [rider, driver] } }
      responses:
        '200':
          description: Badges (full catalog with earned flags) and the level ladder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GamificationView' }

  /api/v1/challenges:
    get:
      tags: [Gamification]
      summary: Open and recent challenges of my region and role, with my progress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: as, in: query, required: true, schema: { type: string, enum: [rider, driver] } }
      responses:
        '200':
          description: Running first, then upcoming, then recently ended
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChallengeView' }

  /api/v1/admin/promos:
    post:
      tags: [AdminPromos]
      summary: Create a promo (UC-A-26; promos:manage, audited)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePromoRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promo' }
        '409': { description: '`promo_code_taken`' }
        '422': { description: 'Validation: `fixed_needs_region` | `window_invalid` | `value_invalid` (percent above 100)' }
    get:
      tags: [AdminPromos]
      summary: List promos (promos:view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean }, description: Active-flag filter }
        - { name: running, in: query, schema: { type: boolean }, description: 'true = active AND the window contains now (M13 review W17: the dashboard KPI)' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Newest first, each with its redemption counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoPage' }

  /api/v1/admin/promos/{promoId}:
    parameters:
      - { name: promoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [AdminPromos]
      summary: One promo with its redemptions (promos:view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: The promo and one redemptions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoDetail' }
        '404': { description: Unknown }
    patch:
      tags: [AdminPromos]
      summary: Edit or deactivate (promos:manage, audited)
      description: >
        Editable: window, caps, per-user limit, restrictions, `active` (false = deactivate —
        existing redemptions stand, new ones are refused). `code`, `type` and `value` are fixed
        after creation; a different discount is a new promo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchPromoRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promo' }
        '404': { description: Unknown }
        '422': { description: '`window_invalid`' }

  /api/v1/admin/challenges:
    post:
      tags: [AdminChallenges]
      summary: Create a challenge (UC-A-28; challenges:manage, audited)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveChallengeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '422': { description: '`window_invalid`' }
    get:
      tags: [AdminChallenges]
      summary: List challenges (challenges:view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Newest first with participation counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengePage' }

  /api/v1/admin/challenges/{challengeId}:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [AdminChallenges]
      summary: One challenge with its participation (challenges:view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: The challenge and one participation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeDetail' }
        '404': { description: Unknown }

  /api/v1/admin/challenges/{challengeId}/end:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AdminChallenges]
      summary: End early (challenges:manage, audited) — completions already made keep their reward
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '409': { description: '`already_ended`' }

  /api/v1/admin/users/{userId}/gamification:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [AdminGamification]
      summary: A user's badges and levels for the admin profile (UC-A-13, ADM-05; users:view)
      description: >
        Added at the M15 review fix (H3) for the profile's History tab. The rider and driver
        views are exactly what `GET /gamification/me?as=rider|driver` serves the user; a role the
        user does not hold is null. A read — not audited.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user's rider and driver views
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserGamification' }
        '403': { description: Missing `users:view` }
        '404': { description: Unknown user }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ValidatePromoRequest:
      type: object
      required: [code, regionId, serviceTypeId]
      properties:
        code: { type: string }
        regionId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        estimateTotal: { type: string, description: Decimal; when given, the preview computes the discount against it }
        scheduledAt: { type: string, format: date-time, description: Present for a scheduled booking (ruling 3) }
    PromoValidation:
      type: object
      required: [code, type, value, discountPreview]
      properties:
        code: { type: string }
        type: { type: string, enum: [percent, fixed] }
        value: { type: string, description: Decimal — percent 0–100 or fixed amount in the region currency }
        maxDiscount: { type: [string, 'null'] }
        discountPreview: { type: [string, 'null'], description: Against estimateTotal when given; null for a scheduled booking (priced at ride time) }
    Promo:
      type: object
      required: [promoId, code, type, value, startsAt, endsAt, perUserLimit, firstRideOnly, active, redemptionCount]
      properties:
        promoId: { type: string, format: uuid }
        code: { type: string }
        regionId: { type: [string, 'null'], format: uuid }
        serviceTypeId: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [percent, fixed] }
        value: { type: string }
        maxDiscount: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        perUserLimit: { type: integer }
        totalCap: { type: [integer, 'null'] }
        firstRideOnly: { type: boolean }
        active: { type: boolean }
        redemptionCount: { type: integer }
        redeemedAmount: { type: [string, 'null'], description: 'Sum of discounts applied on COMPLETED rides — reservations on live rides are excluded, and redemptionCount likewise counts live + completed rides only (M13 review W6; single-currency promos)' }
    SavePromoRequest:
      type: object
      required: [code, type, value, startsAt, endsAt]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9]{3,20}$', description: Stored uppercase }
        regionId: { type: [string, 'null'], format: uuid }
        serviceTypeId: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [percent, fixed] }
        value: { type: string }
        maxDiscount: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        perUserLimit: { type: integer, minimum: 1, default: 1 }
        totalCap: { type: [integer, 'null'], minimum: 1 }
        firstRideOnly: { type: boolean, default: false }
    PatchPromoRequest:
      type: object
      properties:
        regionId: { type: [string, 'null'], format: uuid }
        serviceTypeId: { type: [string, 'null'], format: uuid }
        maxDiscount: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        perUserLimit: { type: integer, minimum: 1 }
        totalCap: { type: [integer, 'null'], minimum: 1 }
        firstRideOnly: { type: boolean }
        active: { type: boolean }
    PromoPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Promo' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
    PromoRedemption:
      type: object
      required: [promoRedemptionId, userId, rideId, amount, currency, createdAt]
      properties:
        promoRedemptionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        rideId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
    PromoDetail:
      type: object
      required: [promo, redemptions]
      properties:
        promo: { $ref: '#/components/schemas/Promo' }
        redemptions:
          type: object
          required: [items, page, size, totalItems]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PromoRedemption' } }
            page: { type: integer }
            size: { type: integer }
            totalItems: { type: integer }
    ReferralStatus:
      type: object
      required: [code, referees, enteredCode, reward]
      properties:
        code: { type: string, description: The caller's share code }
        enteredCode: { type: [string, 'null'], description: The code the caller entered as a referee, if any }
        reward:
          type: [object, 'null']
          description: The requested region's referral reward, both sides; null when no regionId was given (as on /referrals/enter)
          required: [regionId, currency, referrerAmount, refereeAmount]
          properties:
            regionId: { type: string, format: uuid }
            currency: { type: string }
            referrerAmount: { type: string, description: Decimal, region currency }
            refereeAmount: { type: string, description: Decimal, region currency }
        referees:
          type: array
          description: The caller's referees, newest first — status only, never phone or full name
          items:
            type: object
            required: [status, createdAt]
            properties:
              firstName: { type: string }
              status: { type: string, enum: [pending, rewarded, blocked] }
              createdAt: { type: string, format: date-time }
              rewardedAt: { type: [string, 'null'], format: date-time }
    LoyaltyBalance:
      type: object
      required: [redeemable, lifetime, level, levels, rule]
      properties:
        redeemable: { type: integer }
        lifetime: { type: integer }
        level: { type: string, enum: [bronze, silver, gold, platinum] }
        levels:
          type: array
          description: The ladder with thresholds (lifetime points)
          items:
            type: object
            required: [level, thresholdPoints]
            properties:
              level: { type: string }
              thresholdPoints: { type: integer }
        rule:
          type: object
          required: [regionId, currency, pointsPerCurrencyUnit, redemptionThresholdPoints, redemptionRate]
          properties:
            regionId: { type: string, format: uuid }
            currency: { type: string }
            pointsPerCurrencyUnit: { type: string, description: Decimal }
            redemptionThresholdPoints: { type: integer }
            redemptionRate: { type: string, description: Decimal — wallet credit per point }
    PointsTransaction:
      type: object
      required: [pointsTransactionId, type, points, createdAt]
      properties:
        pointsTransactionId: { type: string, format: uuid }
        type: { type: string, enum: [accrual, redemption, challenge, adjustment] }
        points: { type: integer, description: Signed }
        rideId: { type: [string, 'null'], format: uuid }
        challengeId: { type: [string, 'null'], format: uuid }
        walletTransactionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    PointsTransactionPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PointsTransaction' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
    GamificationView:
      type: object
      required: [badges, level, lifetime, levels]
      properties:
        badges:
          type: array
          description: The whole catalog in sort order, earned or not
          items:
            type: object
            required: [badgeCode, earned]
            properties:
              badgeCode: { type: string, enum: [ride_10, ride_50, ride_100, first_shared_ride, first_referral, five_star_week] }
              earned: { type: boolean }
              awardedAt: { type: [string, 'null'], format: date-time }
        level: { type: string, enum: [bronze, silver, gold, platinum] }
        lifetime: { type: integer, description: Riders — loyalty earned; drivers — trips + challenge points }
        driverTrips: { type: [integer, 'null'], description: "Driver view only: completed trips (amended at T4 sign-off 2026-10-18: the approved driver board shows the split); null for riders" }
        challengePoints: { type: [integer, 'null'], description: "Driver view only: points from challenges; null for riders" }
        levels:
          type: array
          items:
            type: object
            required: [level, thresholdPoints]
            properties:
              level: { type: string }
              thresholdPoints: { type: integer }
    AdminUserGamification:
      type: object
      required: [rider, driver]
      properties:
        rider:
          description: The rider view; null without the rider role
          oneOf:
            - { $ref: '#/components/schemas/GamificationView' }
            - { type: 'null' }
        driver:
          description: The driver view (with the trips / challenge points split); null without the driver role
          oneOf:
            - { $ref: '#/components/schemas/GamificationView' }
            - { type: 'null' }
    ChallengeView:
      type: object
      required: [challengeId, titleEn, titleAr, goalType, goalTarget, rewardPoints, startsAt, endsAt, ended, myProgress, myCompleted]
      properties:
        challengeId: { type: string, format: uuid }
        titleEn: { type: string }
        titleAr: { type: string }
        goalType: { type: string, enum: [completed_rides, shared_rides, five_star_ratings] }
        goalTarget: { type: integer }
        rewardPoints: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        ended: { type: boolean, description: True once past endsAt or ended early }
        myProgress: { type: integer }
        myCompleted: { type: boolean }
    Challenge:
      type: object
      required: [challengeId, regionId, role, titleEn, titleAr, goalType, goalTarget, rewardPoints, startsAt, endsAt, participantCount, completedCount]
      properties:
        challengeId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        role: { type: string, enum: [rider, driver] }
        titleEn: { type: string }
        titleAr: { type: string }
        goalType: { type: string, enum: [completed_rides, shared_rides, five_star_ratings] }
        goalTarget: { type: integer }
        rewardPoints: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        participantCount: { type: integer }
        completedCount: { type: integer }
    SaveChallengeRequest:
      type: object
      required: [regionId, role, titleEn, titleAr, goalType, goalTarget, rewardPoints, startsAt, endsAt]
      properties:
        regionId: { type: string, format: uuid }
        role: { type: string, enum: [rider, driver] }
        titleEn: { type: string, maxLength: 120 }
        titleAr: { type: string, maxLength: 120 }
        goalType: { type: string, enum: [completed_rides, shared_rides, five_star_ratings] }
        goalTarget: { type: integer, minimum: 1 }
        rewardPoints: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    ChallengePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
    ChallengeDetail:
      type: object
      required: [challenge, participation]
      properties:
        challenge: { $ref: '#/components/schemas/Challenge' }
        participation:
          type: object
          required: [items, page, size, totalItems]
          properties:
            items:
              type: array
              items:
                type: object
                required: [userId, progress, completed]
                properties:
                  userId: { type: string, format: uuid }
                  userName: { type: string }
                  progress: { type: integer }
                  completed: { type: boolean }
                  completedAt: { type: [string, 'null'], format: date-time }
            page: { type: integer }
            size: { type: integer }
            totalItems: { type: integer }
