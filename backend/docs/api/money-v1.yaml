openapi: 3.1.0
info:
  title: Labby Money API (M8 contract)
  version: 0.1.0
  description: >
    Contract-first spec for milestone M8, the money rails. The clients (M8-T3 rider, M8-T4
    driver, M8-T5 admin) build against this document; the backend (M8-T2) must implement it
    exactly — on conflict after T2 lands, the implementation is the truth and this file is
    amended. Schema: migration V12. SRS: PAY-01..04, COM-01..04, PRC-03 (charging), NFR-I2;
    UC-R-07/08/09/17, UC-D-15/16, UC-A-15/27. Out of M8: promo/referral/loyalty credit SOURCES
    (M13 — the wallet accepts their typed credits now), incentives engine (M15), support-ticket
    links on refunds (M14).


    **Money representation.** Every amount is an exact decimal (NUMERIC in the database, never
    floating point) tagged with its ISO 4217 currency. Derived amounts (commission, wait
    per-minute, pickup per-km) round HALF_UP to 2 decimals at computation (owner ruling
    2026-10-11); display formatting (e.g. SYP without decimal places) is a client concern
    (NFR-I2) — except in server-rendered push copy, which formats amounts itself (M8 audit W8):
    grouping separators, Western digits, SYP without decimals and other currencies with 2,
    English `SYP 500,000`, Arabic `500,000 ل.س`, a leading minus for negatives. Wallet credits
    are spendable only in matching-currency regions — no conversion (PAY-01).


    **Ledgers are append-only.** `wallet_transactions`, `driver_ledger` and `settlements` accept
    inserts only (database triggers block UPDATE/DELETE). Balances (`wallet_balances`,
    `driver_balances`) are per-currency caches updated in the same transaction as their ledger
    entry and always equal the ledger sum. Corrections are new entries (refund, grant,
    counter-settlement), never edits.


    **Payment application at completion (PAY-02, UC-R-07).** Method `cash`: unchanged from M7
    (`pending → paid_cash` via cash-confirm or `pending → unpaid` via mark-unpaid). Method
    `wallet`: at completion the rider's wallet balance in the ride currency is applied — covers
    the total → one `fare_payment` debit; short → the wallet is drained and the remainder is due
    in CASH, shown to both parties (`walletApplied` / `cashDue` / `carriedDues` on the ride
    detail and receipt, rides-v1.yaml). The rider's pending dues in the ride's currency (below)
    are carried on top at the same completion. `paymentStatus = paid_wallet` (confirmed
    immediately) ONLY when the wallet covered the whole fare AND no due is carried in cash;
    otherwise the ride stays `pending` and the driver cash-confirms or marks unpaid (owner
    ruling 2026-10-12, M8 audit H3). Cash-confirm: a wallet-method ride whose wallet paid part of
    the fare (`walletApplied` > 0) → `paid_mixed`; a wallet-method ride with nothing applied, or
    a cash-method ride → `paid_cash`.
    **Zero total (V1 audit C2/W29, 2026-10-20).** When a promo covers the whole fare (or share)
    the amount to collect is 0: nothing is debited from the wallet (no zero-amount entry is ever
    written) and, when no due is carried in cash, the payment settles AT COMPLETION —
    `paid_wallet` for a wallet payer, `paid_cash` for a cash payer (nothing was collected), with
    `paymentConfirmedAt` set — so the driver is never asked to collect 0 or cash-confirm. The
    same holds per member of a shared ride. A zero total that still carries cash dues stays
    `pending` as above.


    **Payment seam (ES-06, NFR-M1).** Every by-method collection above and below (fare or share,
    carried dues, cancellation fees) goes through the backend's `PaymentProvider` interface, one
    provider per method: `wallet` debits the earned-credit wallet, `cash` collects nothing
    on-platform (paid in person, settled by cash-confirm). V2 card gateways plug in behind it; the
    wire contract does not change.


    **Cancellation fees (RIDE-07, PRC-03; owner rulings 2026-10-11).** The fee recorded on a
    cancelled ride goes 100% to that ride's driver, commission-free. Collection: on a
    wallet-method ride the wallet is debited at cancellation (`cancellation_fee`, linked to the
    cancelled ride); whatever the wallet cannot cover — and the whole fee on a cash-method
    ride — becomes a pending RIDER DUE, carried by the rider's next completed ride IN THE DUE'S
    CURRENCY (any method, all such pending dues at once; dues in other currencies stay pending
    for a ride in their currency — PAY-01 isolation, owner ruling 2026-10-12). Each carried due
    is paid in full or not at all: on a wallet-method ride from the wallet when it covers the due
    (after the fare) — collected at completion; otherwise in CASH through the carrying ride's
    driver — EARMARKED at completion (no money moves) and collected when the driver
    cash-confirms: that driver gets a `due_collection` debit (they pocketed the extra cash,
    `ride_id` = the carrying ride, `rider_due_id` = the due) and the cancelled ride's driver the
    `cancellation_fee` credit. Mark-unpaid releases the earmark (no ledger lines) — the due is
    pending again and the rider's next same-currency ride carries it. Every mark-unpaid (ride or
    shared member) also opens an `unpaid_ride` support ticket for the ride on the driver's behalf
    (V1 audit W30, owner ruling 2026-10-20; support-v1.yaml (3b)). The driver is credited
    ONCE, when the fee is fully collected. Fees recorded during M7 were backfilled as pending
    dues (V12) and collect the same way.


    **Tips (PAY-04, UC-R-08).** Wallet-only, during the ride (`in_progress`) or ≤ 24 h after
    `completedAt`; one tip per ride (owner ruling; per member on a shared ride, M12); 100% to the driver, commission-free, outside
    the fare total (receipts show it as its own line). Insufficient wallet balance → 409 (cash
    tips happen outside the app). Suggested amounts are a client concern.


    **Driver ledger (COM-01/02).** One fare entry per completed ride (M12: per member of a
    shared ride — the entry carries `sharedRideMemberId`, and the member's share is the fare;
    scheduled-shared-v1.yaml), netting what the platform
    holds for the driver: `walletApplied − commission` — a fully wallet-paid ride is the
    `ride_earning` credit of fare − commission, a cash ride (walletApplied 0) the
    `commission_due` debit (driver keeps the cash), and a mixed ride lands in between (positive →
    `ride_earning`, negative → `commission_due`; an exactly-zero net posts nothing — the ledger
    forbids zero amounts). Every fare entry is itemized (fare, rate, commission). The commission
    rate is the driver's weekly rate for the ride's region: tiers from the region config
    (COM-02), computed per Monday-start week (region time zone) from the PREVIOUS week's
    completed trips in that region — by the weekly job, or by the week's first completion when
    the job has not run yet (stored idempotently; M8 audit W1). The balance view reports the
    same rate without storing it.


    **Floor (COM-03, UC-D-16).** Per region (`driverBalanceFloor`, regions-v1.yaml; NULL = the
    SRS default −50), checked against the driver's balance in that region's currency. Dispatch
    excludes drivers at or below the floor; status `warning` within the region's
    `floorWarningMargin` above it (regions-v1.yaml; NULL = the global `MONEY_FLOOR_WARNING_MARGIN`,
    default 10; owner ruling 2026-10-20: floor and margin are per-region amounts in the region's
    currency), `blocked` at/below. A settlement that lifts the balance above the
    floor unblocks automatically and notifies the driver (UC-A-27).


    **Admin money actions** are permission-gated (`x-required-permission`, enforced server-side
    per RBAC-03) and audit-logged (`wallet.grant`, `wallet.refund`, `settlement.record`).
    New catalog entries: `wallets:view`, `wallets:manage` (RbacCatalogSeeder syncs them;
    `settlements:view/record` exist since M3). Errors use the global ErrorResponse shape
    (status, message, fieldErrors?, code? — machine code on 409s where documented).

servers:
  - url: /api/v1

paths:
  /wallet:
    get:
      summary: My wallet — per-currency balances and pending dues (UC-R-17)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Balances (possibly empty) and pending dues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletView' }

  /wallet/transactions:
    get:
      summary: My wallet history — typed, newest first (UC-R-17)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: currency, in: query, schema: { type: string }, description: Filter one currency }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransactionPage' }

  /rides/{rideId}/tip:
    post:
      summary: Tip the driver from the wallet (PAY-04, UC-R-08)
      description: >
        Rider of the ride only. Allowed from `in_progress` until 24 h after `completedAt`; one
        tip per ride. The tip is debited in the ride's currency and credited 100% to the driver,
        commission-free. Every 409 carries a machine `code` (ErrorResponse `code`; clients
        switch on it, never on the message): `tip_window_closed` (more than 24 h after
        completion), `already_tipped`, `insufficient_balance` (wallet short in the ride's
        currency), `not_tippable` (wrong state / cancelled).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: rideId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipRequest' }
      responses:
        '201':
          description: Tip applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipResponse' }
        '400': { description: Invalid amount }
        '404': { description: Not the rider's ride / unknown ride }
        '409':
          description: >
            `code` = `tip_window_closed` | `already_tipped` | `insufficient_balance` |
            `not_tippable`

  /driver/earnings:
    get:
      summary: Per-trip earnings, newest first (COM-01, UC-D-15)
      description: >
        Driver role. One entry per ride with money posted for the driver, fully itemized — and
        (V1 conformance W43, REP-01 / UC-S-18; boards V1FDriverEarningsTrips) one entry per ride
        the driver ACCEPTED that was later cancelled (`cancelled_by_rider` /
        `cancelled_by_driver`) with no money posted for them, so every past trip can be opened
        and its rider reported. On a shared ride, rows are per member. Ordered by the row moment
        (`completedAt`), newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of trip earnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEarningPage' }

  /driver/earnings/rides/{rideId}:
    get:
      summary: One trip's detail with the driver's report status (V1 conformance W43, UC-D-15, REP-01)
      description: >
        Driver role. The `TripEarning` row of a ride this driver drove (money posted) or accepted
        before it was cancelled — boards V1FDriverTripDetail / TripDetailCancelled. `canReport`
        drives the "Report rider" action (trust-v1 POST /rides/{rideId}/reports, with
        `memberId` on a shared ride); `myReport` the "You reported …" block. A completed trip also
        carries its route map (`pickup`, `destination`, `route` — never on the paged list). 404
        for any other ride (not this driver's, never accepted, still live).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: rideId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: memberId
          in: query
          description: The shared-ride member the row is about; 400 `member_required` when omitted on a ride with several member rows
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEarning' }
        '400': { description: '`member_required`' }
        '403': { description: Not an approved driver }
        '404': { description: No such trip of this driver }

  /driver/earnings/summary:
    get:
      summary: Weekly / monthly earnings summary (UC-D-15)
      description: >
        `period=weekly` → the Monday-start week (driver's operating region time zone) containing
        `anchor` (default today); `period=monthly` → the calendar month containing `anchor`.
        Totals cover the operating region's currency. 404 while the driver has no operating
        region yet (never located, never rode); 400 for a missing period or any period other
        than weekly|monthly.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [weekly, monthly] } }
        - { name: anchor, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Summary for the period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EarningsSummary' }
        '400': { description: Missing or unknown period (only weekly / monthly) }
        '404': { description: No operating region yet }

  /driver/balance:
    get:
      summary: Balance, floor status and commission tier (COM-02/03, UC-D-16)
      description: >
        Floor and status are evaluated per currency against the driver's operating region (the
        region of their most recent online presence, falling back to their last ride's region).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Balance view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverBalanceView' }

  /admin/users/{userId}/wallet:
    get:
      summary: Inspect a user's wallet (extends UC-A-13)
      security: [{ bearerAuth: [] }]
      x-required-permission: 'wallets:view'
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Balances and pending dues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletView' }
        '404': { description: Unknown user }

  /admin/users/{userId}/wallet/transactions:
    get:
      summary: A user's wallet history (extends UC-A-13)
      security: [{ bearerAuth: [] }]
      x-required-permission: 'wallets:view'
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransactionPage' }
        '404': { description: Unknown user }

  /admin/users/{userId}/wallet/credits:
    post:
      summary: Grant wallet credit / issue a refund (PAY-03, UC-A-15)
      description: >
        `type=grant` — reason mandatory, ride link optional. `type=refund` — reason AND `rideId`
        mandatory (PAY-03 link; ticket links arrive with M14). Credited instantly in the given
        currency; the user is notified; the action is audit-logged. 400 for a `rideId` that is
        not a ride of this user, a `currency` no region uses (M8 audit W7), and a refund whose
        `currency` differs from its ride's.
      security: [{ bearerAuth: [] }]
      x-required-permission: 'wallets:manage'
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletCreditRequest' }
      responses:
        '201':
          description: Credit applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransaction' }
        '400': { description: Invalid amount / currency / ride link }
        '404': { description: Unknown user }

  /admin/drivers/{driverUserId}/ledger:
    get:
      summary: A driver's ledger — balances + typed entries, newest first (UC-A-27 step 1)
      security: [{ bearerAuth: [] }]
      x-required-permission: 'settlements:view'
      parameters:
        - { name: driverUserId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Ledger view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverLedgerView' }
        '404': { description: Not a driver }

  /admin/drivers/{driverUserId}/settlements:
    post:
      summary: Record a settlement (COM-04, UC-A-27)
      description: >
        Records off-app money movement — `pay_in` (driver handed cash, credits the balance) or
        `pay_out` (positive balance paid out, debits it). Any positive amount is legal (it
        records the truth, including overshoot); settlements are immutable — a mistake is
        corrected by a counter-settlement. The response carries the new balance and floor
        status; crossing back above the floor unblocks offers automatically and notifies the
        driver. Audit-logged. 400 when `currency` is neither a currency the driver already
        holds a balance in nor the currency of the driver's operating region (M8 audit W7).
      security: [{ bearerAuth: [] }]
      x-required-permission: 'settlements:record'
      parameters:
        - { name: driverUserId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementRequest' }
      responses:
        '201':
          description: Settlement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementResponse' }
        '400': { description: Invalid amount / direction / currency }
        '404': { description: Not a driver }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    WalletBalance:
      type: object
      required: [currency, balance]
      properties:
        currency: { type: string, description: ISO 4217 }
        balance: { type: number, minimum: 0 }
    RiderDue:
      type: object
      description: >
        A carried charge (owner ruling (a)) collected on the rider's next completed ride in the
        due's currency. `pending` dues are shown wherever the fee is displayed (M8-T3); a due a
        completed ride carries in cash stays `pending` until that ride's cash-confirm (rides-v1
        `carriedDues`).
      required: [id, currency, amount, type, sourceRideId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: number }
        type: { type: string, enum: [cancellation_fee] }
        sourceRideId: { type: string, format: uuid, description: The cancelled ride }
        status: { type: string, enum: [pending, collected] }
        collectedRideId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        collectedAt: { type: [string, 'null'], format: date-time }
    WalletView:
      type: object
      required: [balances, dues]
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/WalletBalance' }
        dues:
          type: array
          description: Pending dues only
          items: { $ref: '#/components/schemas/RiderDue' }
    WalletTransactionType:
      type: string
      enum: [fare_payment, tip, cancellation_fee, refund, admin_grant, referral, promo,
             loyalty_redemption]
      description: Credits positive, debits negative (PAY-01 sources; M13 fills the last three)
    WalletTransaction:
      type: object
      required: [id, currency, amount, type, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: number, description: Signed }
        type: { $ref: '#/components/schemas/WalletTransactionType' }
        rideId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'], description: Grants/refunds — shown in history }
        balanceAfter: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
    WalletTransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WalletTransaction' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    TipRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0, description: In the ride's currency }
    TipResponse:
      type: object
      required: [rideId, amount, currency, walletBalance, createdAt]
      properties:
        rideId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        walletBalance: { type: number, description: Remaining balance in that currency }
        createdAt: { type: string, format: date-time }
    TripEarning:
      type: object
      description: >
        COM-01 itemization for one ride that moved money: a completed ride's fare posting, or a
        CANCELLED ride whose collected fee was credited to this driver — such a row carries
        fareTotal / commissionRate / commissionAmount 0, the fee in `cancellationFee`, and the
        collection moment as `completedAt`. A completed SHARED ride has one row per member
        (that member's share); each row carries that member's own `tip` and, for the member who
        redeemed the promo, the `promoCompensation` — never repeated on every share (V1 audit H6).
        V1 conformance W43: a ride the driver ACCEPTED that was later cancelled without money for
        them is a row too — fareTotal / commissionRate / commissionAmount / net 0, tip /
        cancellationFee / promoCompensation null, `completedAt` = the cancellation moment.
      required: [rideId, completedAt, currency, fareTotal, paymentMethod, commissionRate,
                 commissionAmount, net, rideState, kind, canReport]
      properties:
        rideId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time, description: Completion (or fee collection) moment }
        currency: { type: string }
        fareTotal: { type: number }
        paymentMethod: { type: string, enum: [cash, wallet] }
        commissionRate: { type: number, description: Percent applied (weekly tier) }
        commissionAmount: { type: number }
        tip: { type: [number, 'null'] }
        cancellationFee: { type: [number, 'null'], description: Collected fee credited for this ride }
        promoCompensation:
          type: [number, 'null']
          description: >
            M13 ruling 1 (amended at M13-T5): the platform-funded promo discount credited for this
            ride (`promo_compensation`), already inside `net`; null when the ride had no promo.
        net:
          type: number
          description: >
            Signed effect on the balance: wallet ride fare − commission (+ tip + promo
            compensation); cash ride −commission (+ tip + promo compensation) — the driver kept
            the cash fare. (Dues collected in cash through this driver pass outside the trip rows;
            they show in the admin ledger.)
        memberId: { type: [string, 'null'], format: uuid, description: The shared-ride member the row is about (null on a one-rider ride) }
        rideState: { type: string, enum: [completed, cancelled_by_rider, cancelled_by_driver] }
        kind: { type: string, enum: [on_demand, scheduled, shared] }
        riderFirstName: { type: [string, 'null'], description: "The rider's first name (the member's on a shared ride)" }
        pickupLabel: { type: [string, 'null'] }
        destinationLabel: { type: [string, 'null'] }
        serviceTypeNameEn: { type: [string, 'null'] }
        serviceTypeNameAr: { type: [string, 'null'] }
        acceptedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time, description: Trip start (completed rides) }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancellationReason:
          type: [string, 'null']
          description: The ride's (or the member's) cancellation reason (rides-v1 values)
        cancellationFeeCharged:
          type: [number, 'null']
          description: >
            The fee the rider (member) was charged for the cancellation; null = no fee (e.g.
            inside the free window, or a driver cancellation). What reached the driver is
            `cancellationFee`.
        myReport:
          type: [object, 'null']
          description: The driver's own report on this row's rider (REP-01 — one per ride per rider)
          required: [id, category, status, createdAt]
          properties:
            id: { type: string, format: uuid }
            category: { type: string, enum: [unsafe_behavior, inappropriate_behavior, vehicle_damage, other] }
            status: { type: string, enum: [open, substantiated, unsubstantiated] }
            createdAt: { type: string, format: date-time }
        canReport:
          type: boolean
          description: True while the driver has not reported this row's rider (false on a shared row without a member)
        pickup:
          oneOf:
            - $ref: '#/components/schemas/TripPlace'
            - { type: 'null' }
          description: >
            Board V1FDriverTripDetail route map — the ride's pickup (hollow circle). Set only on
            the trip DETAIL (`GET /driver/earnings/rides/{rideId}`) of a completed ride (on a
            shared ride: a member who rode to the end); null on cancelled rows and on every row
            of the paged list.
        destination:
          oneOf:
            - $ref: '#/components/schemas/TripPlace'
            - { type: 'null' }
          description: The ride's drop-off (accent square); set like `pickup`
        route:
          oneOf:
            - $ref: '#/components/schemas/TripRoute'
            - { type: 'null' }
          description: >
            GeoJSON LineString of the in_ride trace, [lng, lat] — the same line as the rider
            receipt's `route` (rides-v1 Receipt). Set like `pickup`; may hold fewer than two
            points (a short trace), so the pins place the map.
    TripPlace:
      type: object
      description: A position plus its display label — the rides-v1 Place shape
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        label: { type: [string, 'null'], maxLength: 200 }
    TripRoute:
      type: object
      description: GeoJSON LineString, coordinates in [lng, lat] order
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    TripEarningPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripEarning' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    EarningsSummary:
      type: object
      required: [period, from, to, currency, trips, fares, commission, tips, net]
      properties:
        period: { type: string, enum: [weekly, monthly] }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        currency: { type: string }
        trips: { type: integer, description: 'Completed rides in the period — a shared ride counts once, however many members paid (V1 audit H6)' }
        fares: { type: number, description: Sum of fare totals }
        commission: { type: number }
        tips: { type: number }
        net:
          type: number
          description: >
            Signed balance effect of the period's ride money (fares, commissions, tips,
            cancellation-fee credits, due collections, bonuses, M13 promo compensations) —
            settlements excluded
    CommissionStatus:
      type: object
      description: COM-02 — the driver's current weekly rate and next-tier progress (UC-D-15)
      required: [percent, weekStart, weeklyTrips]
      properties:
        percent: { type: number, description: Rate applied this week }
        weekStart: { type: string, format: date, description: Monday, region time zone }
        weeklyTrips: { type: integer, description: Previous week's completed trips (set this rate) }
        currentWeekTrips: { type: integer, description: Completed trips so far THIS week }
        nextTier:
          oneOf:
            - type: object
              required: [percent, weeklyTripsAbove]
              properties:
                percent: { type: number }
                weeklyTripsAbove: { type: integer, description: Trips needed this week to earn it next week }
            - { type: 'null' }
    FloorStatus:
      type: string
      enum: [ok, warning, blocked]
      description: >
        COM-03 — `warning` within the region's floorWarningMargin (NULL = MONEY_FLOOR_WARNING_MARGIN,
        default 10) above the floor,
        `blocked` at/below (no new offers until settlement)
    DriverBalanceEntry:
      type: object
      required: [currency, balance, floor, status]
      properties:
        currency: { type: string }
        balance: { type: number, description: Signed — negative = debt }
        floor:
          type: number
          description: >
            The operating region's floor when its currency matches this entry, else the SRS
            default (-50)
        status: { $ref: '#/components/schemas/FloorStatus' }
        floorRegionId:
          type: [string, 'null']
          format: uuid
          description: The region whose floor and margin apply (review V1 W4 ledger card); null = the SRS default
        floorRegionName: { type: [string, 'null'], description: 'That region''s name ("Floor · Damascus")' }
    DriverBalanceView:
      type: object
      required: [balances, commission]
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/DriverBalanceEntry' }
        commission:
          oneOf:
            - { $ref: '#/components/schemas/CommissionStatus' }
            - { type: 'null' }
    DriverLedgerType:
      type: string
      description: >
        `promo_compensation` (M13 ruling 1, V25): the platform-funded promo discount credited to
        the ride's driver, one per ride, so a promo ride pays the driver like the same ride without
        the promo.
      enum: [ride_earning, commission_due, tip, cancellation_fee, settlement_pay_in,
             settlement_pay_out, bonus, due_collection, promo_compensation]
    DriverLedgerEntry:
      type: object
      required: [id, currency, amount, type, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: number, description: Signed }
        type: { $ref: '#/components/schemas/DriverLedgerType' }
        rideId: { type: [string, 'null'], format: uuid }
        sharedRideMemberId: { type: [string, 'null'], format: uuid, description: 'M12: the shared-ride member this entry is for (null on one-rider rides)' }
        settlementId: { type: [string, 'null'], format: uuid }
        riderDueId: { type: [string, 'null'], format: uuid }
        fareAmount: { type: [number, 'null'] }
        commissionRate: { type: [number, 'null'] }
        commissionAmount: { type: [number, 'null'] }
        balanceAfter: { type: number }
        createdAt: { type: string, format: date-time }
    DriverLedgerView:
      type: object
      required: [balances, entries, page, size, totalItems, totalPages]
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/DriverBalanceEntry' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DriverLedgerEntry' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    WalletCreditRequest:
      type: object
      required: [type, amount, currency, reason]
      properties:
        type: { type: string, enum: [grant, refund] }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        rideId:
          type: [string, 'null']
          format: uuid
          description: Mandatory for `refund`, optional for `grant` (PAY-03)
    SettlementRequest:
      type: object
      required: [amount, direction, currency]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        direction: { type: string, enum: [pay_in, pay_out] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        note: { type: [string, 'null'], maxLength: 500 }
    SettlementResponse:
      type: object
      required: [id, driverUserId, currency, amount, direction, createdAt, balance, floorStatus]
      properties:
        id: { type: string, format: uuid }
        driverUserId: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string, enum: [pay_in, pay_out] }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        balance: { type: number, description: New balance in that currency }
        floorStatus: { $ref: '#/components/schemas/FloorStatus' }
