openapi: 3.1.0
info:
  title: Labby Rides API (M7 contract)
  version: 0.1.0
  description: >
    Contract-first spec for milestone M7, the on-demand ride loop. The clients (M7-T3 rider,
    M7-T4 driver, the admin ride pages) build against this document; the backend (M7-T2) must
    implement it exactly — on conflict after T2 lands, the implementation is the truth and this
    file is amended (amended at M7-T2 to the implementation). Schema: migrations V10 + V11. SRS: RIDE-01..08, TRK-02/03/04, PRC-01 core
    (base/km/min/minimum, surcharge windows), PRC-04, RIDE-07 grace logic, USR-03 rider extras;
    UC-R-01..07/09, UC-D-06..10, UC-A-18. Out of M7: wallet and mixed payment, wait-time and
    pickup-distance CHARGES (computed as 0 until M8), cancellation-fee COLLECTION (M8), surge
    values (the pickup zone's live multiplier since M9, PRC-02), promos (M8+), chat/dial/SOS (M10), ratings (M11).


    **State machine (RIDE-02).** `requested → offering → accepted → driver_arrived →
    in_progress → completed`; terminal exits `cancelled_by_rider`, `cancelled_by_driver`,
    `no_driver_found`. Every transition stores its own timestamp on the ride and is announced to
    BOTH parties on the realtime socket (`ride.state`, below). The complete transition table —
    nothing else is legal; any other request is answered 409 with the ride's current state:


    | # | From | To | Caused by | Rule |

    |---|---|---|---|---|

    | 1 | (none) | `requested` | rider `POST /rides` | booking validated (below); surge multiplier and surcharge % LOCKED; estimate stored |

    | 2 | `requested` | `offering` | dispatch | the first eligible candidate exists → first offer opened |

    | 3 | `requested` | `no_driver_found` | dispatch | no eligible candidate at all (candidate exhaustion, RIDE-03) |

    | 4 | `offering` | `offering` | dispatch | an offer was declined or timed out and another candidate exists → next offer (NOT a state change; recorded in the offers trail only) |

    | 5 | `offering` | `accepted` | driver `POST /driver/offers/{id}/accept` | only the open offer's driver, before it expires; driver + vehicle bound; cancellation grace clock starts |

    | 6 | `offering` | `no_driver_found` | dispatch | candidates exhausted, or 10 min (`DISPATCH_GIVE_UP_MINUTES`) since `requestedAt` |

    | 7 | `accepted` | `driver_arrived` | driver `POST /driver/rides/{id}/arrive` | driver's latest position within 100 m (`ARRIVE_GEOFENCE_METERS`) of the pickup, else 422 with the distance (UC-D-07 E1); wait grace clock starts |

    | 8 | `driver_arrived` | `in_progress` | driver `POST /driver/rides/{id}/start` | metering starts |

    | 9 | `in_progress` | `completed` | driver `POST /driver/rides/{id}/complete` | metered fare computed and STORED (fares); `paymentStatus = pending` |

    | 10 | `requested`, `offering`, `accepted`, `driver_arrived` | `cancelled_by_rider` | rider `POST /rides/{id}/cancel` | fee rule below; an open offer is withdrawn; an assigned driver is released |

    | 11 | `accepted`, `driver_arrived` | `cancelled_by_driver` | driver `POST /driver/rides/{id}/cancel` | reason mandatory; never charges the rider (except `rider_no_show`, below); a NEW linked ride is dispatched (below) |


    `in_progress` cannot be cancelled by either side (UC-R-09 E1). After `completed` only the
    PAYMENT moves (`paymentStatus`: `pending → paid_cash` via cash-confirm, or `pending →
    unpaid` via mark-unpaid, UC-D-09 E1) — not the ride state. Concurrency: the ride row carries an
    optimistic lock and the offer row its response; of two racing requests (rider cancel vs
    driver accept, two accepts, accept vs timeout) exactly one wins and the loser gets 409 —
    every writer locks the ride row first. (A rider may still cancel a ride that was accepted a
    moment earlier: that is transition 10 from `accepted`, not a lost race.) The
    database also guarantees at most ONE open offer per ride and per driver, and one active ride
    per rider.


    **Booking (RIDE-01, UC-R-04).** Validation, in order: rider role `active` (E3 → 403 code
    `rider_suspended`, `details.suspensionReason`); pickup inside an ACTIVE region (E1 → 422
    `outside_region`); at most 3 stops (422 `too_many_stops`); destination and stops inside the
    same region (422 `outside_region`); service type enabled in that region (422
    `service_type_unavailable`); payment method `cash` or — from M8 — `wallet` (payment
    application rules: money-v1.yaml); no other active ride (E4 → 409
    `active_ride_exists`); when `expectedSurgeMultiplier` is sent and differs from the pickup
    zone's current multiplier → 409 `surge_changed` with `details.surgeMultiplier` = the current
    value (re-confirm, then book again; omitted = lock whatever is current). The estimate is
    recomputed server-side at booking — the client's
    figure is never trusted — and stored with the ride; an `approximate` route (OSRM down,
    NFR-A3) is allowed and flagged.


    **Estimate (PRC-01).** `RoutingProvider` route pickup → stops → destination; per service
    type: `base + perKm × km + perMin × min`, + surcharge (`percent` of that subtotal, from the
    window covering the request moment in the region's `timeZone`; start inclusive, end
    exclusive; overnight windows span midnight and belong to the day they start on; start = end
    covers that whole day; overlapping windows → HIGHEST percent, never summed), + surge uplift
    = (subtotal + surcharge) × (multiplier − 1), floored at the service
    type's `minimumFare` (the top-up is its own component). Money is rounded half-up to 2 decimals per component.
    Wait/pickup-fee components are 0 in M7. For `accept_distant_fee` riders the response
    carries the pickup-fee rule (threshold + per-km) so the app can show the potential range
    (UC-R-04 A3).


    **Surge (PRC-02, M9).** The multiplier is the HIGHEST current multiplier among the zones
    covering the pickup (1.0 outside every zone), as stored by the last surge cycle (every 2 min,
    `SURGE_CYCLE_CRON`; regions-v1.yaml). Estimate and booking read the same stored value, so the
    rider is shown exactly what gets locked; `surgeActive` / `surgeZoneName` drive the UC-R-04 A2
    explanation. The value LOCKED on the ride at booking never changes afterwards — later cycles,
    destination changes and driver re-dispatch keep it, and the final fare applies it.


    **Dispatch (RIDE-03).** Eligible candidates: driver role active, application approved,
    online, stream FRESH (last sample ≤ 30 s, TRK-04), an active vehicle assigned the ride's
    service type, no open offer, no active ride, not already offered this ride, and — for
    `nearby_only` riders — straight-line pickup distance ≤ the region's
    `pickupFeeThresholdKm`. Gates are re-checked for every candidate when its offer is opened
    (a driver suspended while online is never offered; suspension also forces the driver
    offline — immediately, or when their current ride ends). Ranking: the
    `DISPATCH_CANDIDATE_POOL_SIZE` (default 5) nearest eligible drivers by straight line, ranked
    by routed pickup ETA from the `RoutingProvider` (straight-line fallback allowed). The
    dispatcher ticks every second (`DISPATCH_CRON`), so the first offer opens ≤ ~1 s after
    booking (NFR-P2). One offer at a time, 15 s window (`DISPATCH_OFFER_SECONDS`); declined or
    timed out → next candidate. The offer shows pickup + distance/ETA, destination, stops,
    estimated fare, surge flag, rider rating (null until M11) and the rider's comfort
    preferences. Offer outcomes (`accepted / declined / timeout / withdrawn`) are the
    acceptance-metric trail; `withdrawn` (the ride ended while the offer was open) does not
    count against the driver.


    **Driver cancellation → re-dispatch (owner decision 2026-10-07, UC-D-10, UC-R-05 E2).**
    The cancelled ride ends `cancelled_by_driver` (terminal, feeds the driver's cancellation
    metric) and, in the same transaction, a NEW ride is created for the rider with the same
    pickup/destination/stops/service type/payment method, the SAME locked surge multiplier,
    surcharge %, estimate and pricing snapshot (V33 rates / extras / cancellation values), and `redispatchOfRideId` set; it starts at `requested` and
    dispatch excludes the driver who cancelled. Both rides appear in history. Exception: a
    `rider_no_show` cancellation (allowed only from `driver_arrived` after the region's wait
    grace, UC-D-07 E2) does NOT re-dispatch and records the region's cancellation fee on the
    rider.


    **Rider cancellation fee (RIDE-07, UC-R-09).** Free before acceptance and until
    `cancellationGraceEndsAt` (= `acceptedAt` + the region's `cancellationGraceMin`, default
    2); after that the region's `cancellationFee` (default 2) is RECORDED on the ride
    (`cancellationFee`) — collection is M8. `GET /rides/{id}/cancellation-quote` tells the app
    which case applies before the rider confirms. Rider reasons: `changed_mind`,
    `driver_too_far`, `wrong_pickup`, `other`. Driver reasons: `rider_no_show`,
    `vehicle_issue`, `unsafe_pickup`, `other`; `other` needs a `note`.


    **Retry (RIDE-08).** `POST /rides/{id}/retry` on a `no_driver_found` ride creates a NEW ride
    with the same inputs (`retryOfRideId` set); the estimate, surcharge and surge are re-priced
    at the moment of retry (it is a new request), but the surge must match what the rider saw
    (PRC-02): the optional body's `expectedSurgeMultiplier`, else the previous ride's locked
    multiplier. A mismatch → 409 `surge_changed` with `details.surgeMultiplier` = the current
    value and no ride is created; the rider re-confirms and retries with that value.


    **In-ride route changes (RIDE-05, UC-R-06).** In `accepted`, `driver_arrived` and
    `in_progress` the rider may replace destination and stops (≤ 3 stops total, else 422
    `too_many_stops`; points must stay inside the region). The estimate is recomputed and
    stored (the locked surge/surcharge are kept); the metered fare is unaffected. Both parties
    receive `ride.updated` (reason `route_changed`).


    **Tracing and metering (TRK-03, RIDE-06).** From acceptance until completion every location
    sample of the assigned driver (socket or REST fallback, realtime-v1) is ALSO appended to the
    ride's trace — phase `to_pickup` until start, `in_ride` after; `recordedAt` later than server
    time is clamped to server time (M6 owner item b). Final fare: distance = sum of great-circle
    segment lengths between consecutive `in_ride` points in `recordedAt` order; duration = `completedAt − startedAt`; pricing as in the
    estimate with the LOCKED surcharge % and surge multiplier; floored at the minimum fare. A gap
    in the trace (connection lost, UC-D-08 E1) contributes the straight segment across it. The
    stored `fares` row is what both parties and the receipt show — never recomputed (PRC-04).


    **Realtime events (TRK-02, RIDE-02).** Server → client frames on the existing
    `/api/v1/realtime` socket (realtime-v1 protocol; clients ignore unknown types). Frames are
    published through Postgres NOTIFY after the transaction commits and every backend instance
    delivers them to its own sockets (owner decision 2026-10-07, NFR-P4). Every ride / offer frame
    carries `"as": "rider" | "driver"` — the party it is for (one account can hold both roles
    with both apps connected); an app ignores frames not addressed to it. On (re)connect,
    clients refetch `GET /rides/active`, `GET /driver/rides/active` or `GET
    /driver/offers/open` — events are not replayed.


    - `{"type":"ride.state","ride":Ride}` — to the rider and the assigned driver on EVERY
    transition (the rider-view or driver-view of the ride respectively). A driver whose open
    offer is withdrawn receives `offer.withdrawn` instead.

    - `{"type":"ride.updated","reason","ride":Ride}` — non-state changes: `route_changed`,
    `payment_confirmed`, `payment_unpaid`.

    - `{"type":"offer.new","offer":RideOffer}` — to the offered driver.

    - `{"type":"offer.withdrawn","offerId","rideId","reason"}` — to that driver; reason
    `timeout`, `ride_ended`, (V1 audit W26) `driver_offline` — the driver went offline or was
    suspended, the offer is withdrawn and dispatch moves on — or (M12, scheduled-shared-v1)
    `scheduled_converted` — the driver's scheduled claim went live, so their open live offer was
    withdrawn.

    - `{"type":"ride.driver_position","rideId","lat","lng","headingDeg"?,"recordedAt","etaSeconds"?}`
    — to the rider for every accepted sample from `accepted` until `completed`; `etaSeconds` is
    to the pickup before start and to the destination after — routed through the stops the
    in-ride trace has not yet passed within 150 m (V1 audit W40) — refreshed by the ride monitor (every 5 s, `RIDE_MONITOR_CRON`) at most
    every 30 s (`RIDE_ETA_REFRESH_SECONDS`) and repeated in between.

    - `{"type":"ride.connection","rideId","driverStream":"ok"|"lost"}` — to both parties when
    the assigned driver's stream goes stale (> 30 s) during `accepted..in_progress` and when it
    resumes (TRK-04, UC-R-05 A1, UC-D-08 E1).


    **Push (NTF, category `ride` — never muted).** The socket carries every transition to both
    parties; an FCM push is ALSO sent to the party that did NOT cause the transition, so a
    backgrounded app learns of it: `ride.offer` → driver (deep link `ride_offer`
    {offerId}); `ride.accepted`, `ride.driver_arrived`, `ride.started`, `ride.completed`,
    `ride.cancelled_by_driver` (+ new ride id), `ride.no_driver_found` → rider (deep link `ride`
    {rideId}); `ride.cancelled_by_rider` → the assigned driver if any (no link). Deep-link
    catalog additions: `ride` (params `rideId`), `ride_offer` (params `offerId`).
    **ETA delay (V1 audit W40, owner ruling 2026-10-20; UC-R-06 step 3):** `ride.eta_delayed` →
    rider(s) (deep link `ride` {rideId}; params `etaMinutes`, `phase` = `pickup` |
    `destination`) when the expected arrival (refresh moment + `etaSeconds`) is 5+ minutes later
    than the last one the rider was told of in this phase (the first ETA of the phase, or the
    last notice), at most once per 5 minutes; category `ride`, EN + AR.


    **Rider info exposure.** Before acceptance the rider sees no driver. From acceptance:
    driver first name, photo, per-role rating (null until M11), vehicle make/model/color/plate +
    first photo, live position (TRK-02). The driver sees the rider's first name, rating (null
    until M11) and comfort preferences from the offer on; never phone numbers (dial is M10).


    **Scheduled and shared rides (M12).** `scheduled-shared-v1.yaml` adds the pre-live states
    `scheduled` and `gathering` (they hold no driver and never count as the rider's active ride),
    their transitions into this state machine (S1..S5, P1..P3), the claim board, the per-member
    rules of shared rides and the `split` payment status. Everything above applies to them once
    they are live, except where that file says otherwise.


    Errors use the global ErrorResponse shape from M1 (status, message, fieldErrors?); ride
    errors add a machine `code` and, where listed, a `details` object (both omitted when not
    set). A request the ride's state does not allow is 409 code `illegal_state` with
    `details.state`. Rider endpoints need the rider role (403 otherwise), driver endpoints an
    approved driver (403 otherwise), admin endpoints the `rides:view` permission.
servers:
  - url: http://localhost:8080
tags:
  - name: RiderPreferences
  - name: SavedLocations
  - name: RiderRides
  - name: DriverOffers
  - name: DriverRides
  - name: AdminRides

paths:
  /api/v1/rider/preferences:
    get:
      tags: [RiderPreferences]
      summary: Comfort preferences + matching toggle (UC-R-02, UC-R-03); defaults when never set
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderPreferences' }
    put:
      tags: [RiderPreferences]
      summary: Replace preferences (applies to every later booking)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderPreferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderPreferences' }
        '400': { description: Unknown value }

  /api/v1/rider/saved-locations:
    get:
      tags: [SavedLocations]
      summary: The rider's saved places, by name (UC-R-01)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All saved places
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedLocation' }
    post:
      tags: [SavedLocations]
      summary: Add a saved place
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedLocationUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLocation' }
        '400': { description: Validation }
        '409': { description: 'Name already used by this rider, case-insensitive (E1) — code `duplicate_name`' }

  /api/v1/rider/saved-locations/{savedLocationId}:
    parameters:
      - { name: savedLocationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SavedLocations]
      summary: Rename / move a saved place
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedLocationUpsertRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLocation' }
        '404': { description: Not this rider's place }
        '409': { description: Duplicate name — code `duplicate_name` }
    delete:
      tags: [SavedLocations]
      summary: Delete a saved place
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not this rider's place }

  /api/v1/rides/estimate:
    post:
      tags: [RiderRides]
      summary: Fare estimate for every enabled service type of the pickup's region (RIDE-01)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/RouteInput' }
                - type: object
                  properties:
                    scheduledAt:
                      type: [string, 'null']
                      format: date-time
                      description: >
                        M12 (RIDE-S1): price a scheduled ride — the surcharge window covering
                        this time, NO surge (1.0); the response says `pricedAtRideTime: true`
      responses:
        '200':
          description: The route once, and an estimate per service type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstimateResponse' }
        '400': { description: Validation }
        '422': { description: 'code `outside_region` | `too_many_stops`' }

  /api/v1/rides:
    post:
      tags: [RiderRides]
      summary: Book a ride (UC-R-04) — ride starts `requested`, dispatch begins
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookRideRequest' }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { description: Validation }
        '403': { description: 'Rider role suspended (E3) — code `rider_suspended`, `details.suspensionReason`' }
        '409':
          description: >
            code `active_ride_exists` (E4) | `surge_changed` (`expectedSurgeMultiplier` no longer
            matches; `details.surgeMultiplier` = the current value, PRC-02)
        '422':
          description: >
            code `outside_region` | `service_type_unavailable` | `too_many_stops` |
            `payment_method_unavailable`
    get:
      tags: [RiderRides]
      summary: The rider's ride history, newest first (all states), with optional filters
      description: >
        V1 conformance W41 (UC-R-16 "list with filters"; boards V1FRiderHistoryFilters / Dates /
        Empty). Every filter is optional and they combine (AND) with each other and with paging;
        `totalItems` counts the filtered rows. The rows are ordered — and the date range applies
        to — the time the ride ran: the conversion time of a claimed scheduled ride, otherwise
        `requestedAt`. `from` / `to` are inclusive calendar days in the ride's REGION time zone.
        400 for an unknown `state` or `kind`, a malformed date, or `from` after `to`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - name: state
          in: query
          description: >
            `completed` = state `completed`; `cancelled` = `cancelled_by_rider`,
            `cancelled_by_driver` or `no_driver_found`. Omitted = every state.
          schema: { type: string, enum: [completed, cancelled] }
        - { name: kind, in: query, description: Omitted = every kind, schema: { type: string, enum: [on_demand, scheduled, shared] } }
        - { name: from, in: query, description: First day, inclusive (region-local), schema: { type: string, format: date, example: '2026-10-01' } }
        - { name: to, in: query, description: Last day, inclusive (region-local), schema: { type: string, format: date, example: '2026-10-19' } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideSummaryPage' }
        '400': { description: Unknown state / kind, malformed date, or from after to }

  /api/v1/rides/active:
    get:
      tags: [RiderRides]
      summary: The rider's active ride, or 204 when none (resync after reconnect)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active ride (rider view)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '204': { description: No active ride }

  /api/v1/rides/{rideId}:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [RiderRides]
      summary: One of the rider's rides (rider view)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this rider's ride }

  /api/v1/rides/{rideId}/cancellation-quote:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [RiderRides]
      summary: Would cancelling now be free? (RIDE-07 grace indication)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The fee that a cancellation right now would record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationQuote' }
        '404': { description: Not this rider's ride }
        '409': { description: Ride not cancellable in its state }

  /api/v1/rides/{rideId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [RiderRides]
      summary: Rider cancels (transition 10)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderCancelRequest' }
      responses:
        '200':
          description: Cancelled; `cancellationFee` set when outside grace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { description: Unknown reason / `other` without note }
        '404': { description: Not this rider's ride }
        '409': { description: Not cancellable in its current state (e.g. `in_progress`) }

  /api/v1/rides/{rideId}/route:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    put:
      tags: [RiderRides]
      summary: Change destination / stops during the ride (RIDE-05, UC-R-06)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteChangeRequest' }
      responses:
        '200':
          description: Route + estimate updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this rider's ride }
        '409': { description: Ride not in accepted / driver_arrived / in_progress }
        '422': { description: 'code `too_many_stops` | `outside_region`' }

  /api/v1/rides/{rideId}/retry:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [RiderRides]
      summary: One-tap retry of a `no_driver_found` ride (RIDE-08) — creates a NEW ride
      description: >
        Re-priced at the moment of retry, but the surge must match what the rider saw (PRC-02):
        `expectedSurgeMultiplier` when sent, else the previous ride's locked multiplier. The body
        is optional.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryRideRequest' }
      responses:
        '201':
          description: The new ride (`retryOfRideId` = the old one), re-priced now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { description: 'Validation (`expectedSurgeMultiplier` below 1.00 or more than 2 decimals)' }
        '404': { description: Not this rider's ride }
        '409':
          description: >
            Not `no_driver_found`, or code `active_ride_exists` | `surge_changed` (the pickup
            zone's surge differs from the expectation; `details.surgeMultiplier` = the current
            value, PRC-02)
        '422': { description: Same booking validation as POST /rides }

  /api/v1/rides/{rideId}/receipt:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [RiderRides]
      summary: Receipt of a completed ride — rendered from stored components (PRC-04)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { description: Not this rider's ride, or not completed }

  /api/v1/driver/offers/{offerId}/accept:
    parameters:
      - { $ref: '#/components/parameters/OfferId' }
    post:
      tags: [DriverOffers]
      summary: Accept the open offer (transition 5)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accepted — the ride in driver view (`accepted`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's offer }
        '409': { description: 'code `offer_closed` — expired, already answered, or the ride ended (UC-D-06 E1), or (V1 audit W26) the driver role is no longer ACTIVE or the driver is offline; `driver_busy` — the driver is already on a live ride (M12, one live ride per driver)' }

  /api/v1/driver/offers/{offerId}/decline:
    parameters:
      - { $ref: '#/components/parameters/OfferId' }
    post:
      tags: [DriverOffers]
      summary: Decline the open offer (counts in the acceptance metric)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Declined; dispatch moves to the next candidate }
        '404': { description: Not this driver's offer }
        '409': { description: 'code `offer_closed`' }

  /api/v1/driver/offers/open:
    get:
      tags: [DriverOffers]
      summary: The driver's open offer, or 204 (resync after reconnect / push tap)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Open offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOffer' }
        '204': { description: No open offer }

  /api/v1/driver/rides/active:
    get:
      tags: [DriverRides]
      summary: The driver's active ride (accepted..in_progress, or completed with payment pending), or 204
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active ride (driver view)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '204': { description: None }

  /api/v1/driver/rides:
    get:
      tags: [DriverRides]
      summary: The driver's ride history, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideSummaryPage' }

  /api/v1/driver/rides/{rideId}:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [DriverRides]
      summary: One of the driver's rides (driver view)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }

  /api/v1/driver/rides/{rideId}/arrive:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: Arrived at pickup (transition 7) — 100 m geofence on the latest server-side position
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '`driver_arrived`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }
        '409': { description: Not `accepted` }
        '422':
          description: code `outside_geofence` (UC-D-07 E1) or `no_position` (no fresh sample)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeofenceError' }

  /api/v1/driver/rides/{rideId}/start:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: Start the ride (transition 8)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '`in_progress`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }
        '409': { description: Not `driver_arrived` }

  /api/v1/driver/rides/{rideId}/complete:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: End the ride (transition 9) — metered fare computed and stored
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '`completed`, `fare` set, `paymentStatus` = pending'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }
        '409': { description: Not `in_progress` }

  /api/v1/driver/rides/{rideId}/cash-confirm:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: Cash collected (UC-D-09) — paymentStatus pending → paid_cash / paid_mixed
      description: >
        M8 (money-v1.yaml): `paid_mixed` when the wallet paid part of the fare (`walletApplied` >
        0), else `paid_cash`. The cash `carriedDues` of the ride are collected now (status
        `earmarked` → `collected`; the driver's `due_collection` debit, the cancelled ride's
        driver's fee credit).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }
        '409': { description: 'code `payment_not_pending` — not completed, or payment already settled' }

  /api/v1/driver/rides/{rideId}/mark-unpaid:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: Rider did not pay (UC-D-09 E1) — paymentStatus pending → unpaid; the ride stays completed
      description: >
        The support-ticket path arrives with support (M10+); M7 records the status only. M8: the
        ride's earmarked cash `carriedDues` are released (pending again, carried by the rider's
        next same-currency ride; no ledger lines) and leave this ride's `carriedDues`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '404': { description: Not this driver's ride }
        '409': { description: 'code `payment_not_pending` — not completed, or payment already settled' }

  /api/v1/driver/rides/{rideId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    post:
      tags: [DriverRides]
      summary: Driver cancels (transition 11) — reason mandatory; rider re-dispatched unless no-show
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverCancelRequest' }
      responses:
        '200':
          description: '`cancelled_by_driver` (driver view)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { description: Unknown reason / `other` without note }
        '404': { description: Not this driver's ride }
        '409': { description: Not accepted / driver_arrived }
        '422': { description: 'code `no_show_too_early` (`details.availableAt`) — `rider_no_show` before `driver_arrived` + wait grace' }

  /api/v1/admin/rides:
    get:
      tags: [AdminRides]
      summary: Search rides (UC-A-18), newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: regionId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/RideState' } }
        - { name: kind, in: query, schema: { type: string, enum: [on_demand, scheduled, shared] } }
        - { name: userId, in: query, description: Rider OR driver, schema: { type: string, format: uuid } }
        - { name: phone, in: query, description: 'Rider or driver phone, any typed form — canonicalized to E.164 like auth-v1 PhoneInput (owner ruling 2026-10-20), then matched exactly', schema: { type: string } }
        - { name: from, in: query, description: 'requestedAt ≥', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'requestedAt <', schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRideSummaryPage' }
        '403': { description: Missing `rides:view` }

  /api/v1/admin/rides/{rideId}:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [AdminRides]
      summary: Full truth of one ride — timeline, trace, offers trail, fare (UC-A-18)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRideDetail' }
        '403': { description: Missing `rides:view` }
        '404': { description: Unknown ride }

  /api/v1/admin/rides/{rideId}/related:
    parameters:
      - { $ref: '#/components/parameters/RideId' }
    get:
      tags: [AdminRides]
      summary: Reports, support tickets, lost-item cases and SOS events of one ride (UC-A-18, review V1 W15)
      description: Each section is gated by its own permission and left out when the caller lacks it (see AdminRideRelated).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The sections the caller may see
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRideRelated' }
        '403': { description: Missing `rides:view` }
        '404': { description: Unknown ride }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RideState:
      type: string
      enum: [scheduled, gathering, requested, offering, accepted, driver_arrived, in_progress,
             completed, cancelled_by_rider, cancelled_by_driver, no_driver_found]
      description: '`scheduled` / `gathering` — M12 pre-live states (scheduled-shared-v1.yaml)'
    PaymentMethod:
      type: string
      enum: [cash, wallet]
      description: '`wallet` accepted from M8 (payment application rules: money-v1.yaml)'
    PaymentStatus:
      type: [string, 'null']
      enum: [pending, paid_cash, paid_wallet, paid_mixed, unpaid, split, null]
      description: >
        `split` (M12) = a completed shared ride, paid per member (scheduled-shared-v1.yaml).
        null until `completed`. M8 (money-v1.yaml): `paid_wallet` = fare fully covered by the
        wallet at completion AND no carried due owed in cash (auto-confirmed); otherwise
        `pending` until the driver cash-confirms — `paid_mixed` when the wallet paid part of the
        fare, else `paid_cash` — or marks it `unpaid`. V1 audit W29: a zero total (a promo
        covering the whole fare) with no due carried in cash settles at completion —
        `paid_wallet` (wallet method) or `paid_cash` (cash method), `paymentConfirmedAt` set —
        never `pending`.
    PickupDistanceMode:
      type: string
      enum: [nearby_only, accept_distant_fee]
      description: UC-R-03 — one exclusive setting, default `nearby_only`
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Place:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        label: { type: [string, 'null'], maxLength: 200, description: Display text (search result / saved name) }
    RouteInput:
      type: object
      required: [pickup, destination]
      properties:
        pickup: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        stops:
          type: array
          maxItems: 3
          description: Intermediate stops in visiting order (more than 3 → 422 `too_many_stops`)
          items: { $ref: '#/components/schemas/Place' }
    BookRideRequest:
      allOf:
        - { $ref: '#/components/schemas/RouteInput' }
        - type: object
          required: [serviceTypeId, paymentMethod]
          properties:
            serviceTypeId: { type: string, format: uuid }
            paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
            expectedSurgeMultiplier:
              type: [number, 'null']
              minimum: 1
              maximum: 99.99
              description: >
                Optional: the multiplier the rider was shown (EstimateResponse.surgeMultiplier),
                at most 2 decimals (400 otherwise). A mismatch with the current value → 409
                `surge_changed`; omitted → the current value is locked (PRC-02)
            promoCode:
              type: [string, 'null']
              maxLength: 20
              description: >
                M13 (growth-v1): a promo to reserve on this ride — re-validated under the promo
                lock; a refused code fails the booking with growth-v1's promo_* codes. The
                discount lands in the fare breakdown's `discount` at completion.
    RetryRideRequest:
      type: object
      properties:
        expectedSurgeMultiplier:
          type: [number, 'null']
          minimum: 1
          maximum: 99.99
          description: >
            Optional: the multiplier the rider confirmed (after a 409 `surge_changed`, its
            `details.surgeMultiplier`), at most 2 decimals; omitted → the previous ride's locked
            multiplier is expected (PRC-02)
    RouteChangeRequest:
      type: object
      required: [destination]
      properties:
        destination: { $ref: '#/components/schemas/Place' }
        stops:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Place' }
    FareComponents:
      type: object
      description: >
        Money components (region currency, 2 decimals). total = baseFare + distanceFare +
        timeFare + surchargeAmount + surgeAmount + waitFare + pickupFee + minimumFareAdjustment −
        discount. waitFare / pickupFee / discount are 0 in M7; surgeMultiplier is the value locked at
        request (PRC-02).
      required: [currency, baseFare, distanceFare, timeFare, surchargePercent, surchargeAmount,
                 surgeMultiplier, surgeAmount, waitFare, pickupFee, minimumFareAdjustment,
                 discount, total]
      properties:
        currency: { type: string }
        baseFare: { type: number }
        distanceFare: { type: number }
        timeFare: { type: number }
        surchargePercent: { type: number }
        surchargeAmount: { type: number }
        surgeMultiplier: { type: number }
        surgeAmount: { type: number }
        waitFare: { type: number }
        pickupFee: { type: number }
        minimumFareAdjustment: { type: number }
        discount: { type: number }
        total: { type: number }
    Estimate:
      type: object
      description: Labeled as an ESTIMATE in every UI (RIDE-01)
      required: [distanceMeters, durationSeconds, approximate, components]
      properties:
        distanceMeters: { type: integer }
        durationSeconds: { type: integer }
        approximate: { type: boolean, description: Straight-line fallback (NFR-A3, UC-R-04 E2) }
        components: { $ref: '#/components/schemas/FareComponents' }
    ServiceTypeEstimate:
      type: object
      required: [serviceTypeId, nameEn, nameAr, estimate]
      properties:
        serviceTypeId: { type: string, format: uuid }
        nameEn: { type: string }
        nameAr: { type: string }
        estimate: { $ref: '#/components/schemas/Estimate' }
    EstimateResponse:
      type: object
      required: [regionId, currency, surgeMultiplier, surgeActive, surgeZoneName, surchargePercent, route,
                 options, pickupDistanceMode]
      properties:
        regionId: { type: string, format: uuid }
        currency: { type: string }
        surgeMultiplier: { type: number, description: "The pickup zone's current multiplier (1.0 outside every zone); booking locks this value" }
        surgeActive: { type: boolean, description: 'surgeMultiplier > 1.0 — show + explain (UC-R-04 A2)' }
        surgeZoneName: { type: [string, 'null'], description: 'The zone the surge comes from; null without surge' }
        surchargePercent: { type: number, description: Active time-window surcharge (0 = none) }
        route:
          type: object
          required: [distanceMeters, durationSeconds, geometry, approximate]
          properties:
            distanceMeters: { type: integer }
            durationSeconds: { type: integer }
            approximate: { type: boolean }
            geometry: { type: object, description: 'GeoJSON LineString, [lng, lat]' }
        options:
          type: array
          items: { $ref: '#/components/schemas/ServiceTypeEstimate' }
        pickupDistanceMode: { $ref: '#/components/schemas/PickupDistanceMode' }
        pricedAtRideTime: { type: boolean, description: 'M12: true when `scheduledAt` was sent — surge evaluated at execution' }
        pickupFeeRule:
          type: [object, 'null']
          description: Only for `accept_distant_fee` riders (UC-R-04 A3) — the fee a far driver would add
          properties:
            thresholdKm: { type: number }
            perKm: { type: number }
    ComfortPreferences:
      type: object
      required: [temperature, conversation, music]
      properties:
        temperature: { type: string, enum: [no_preference, cool, normal, warm] }
        conversation: { type: string, enum: [no_preference, quiet, chatty] }
        music: { type: string, enum: [no_preference, none, soft, any] }
    RiderPreferences:
      allOf:
        - { $ref: '#/components/schemas/ComfortPreferences' }
        - type: object
          required: [pickupDistanceMode]
          properties:
            pickupDistanceMode: { $ref: '#/components/schemas/PickupDistanceMode' }
    SavedLocation:
      type: object
      required: [id, name, lat, lng]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50, description: '"Home", "Work" or custom' }
        lat: { type: number }
        lng: { type: number }
        address: { type: [string, 'null'], maxLength: 200 }
    SavedLocationUpsertRequest:
      type: object
      required: [name, lat, lng]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        address: { type: [string, 'null'], maxLength: 200 }
    DriverSummary:
      type: object
      description: What the rider sees from acceptance on
      required: [firstName, vehicle]
      properties:
        firstName: { type: string }
        photoUrl: { type: [string, 'null'], description: Signed file URL (onboarding-v1 rules) }
        rating: { type: [number, 'null'], description: 'Driver-role lifetime average from the daily snapshot (M11, trust-v1.yaml RATE-02); null below 5 ratings' }
        vehicle:
          type: object
          required: [make, model, color, plate]
          properties:
            make: { type: string }
            model: { type: string }
            color: { type: string }
            plate: { type: string }
            photoUrl: { type: [string, 'null'] }
    RiderSummary:
      type: object
      description: What the driver sees from the offer on
      required: [firstName, comfort]
      properties:
        firstName: { type: string }
        rating: { type: [number, 'null'], description: 'Rider-role lifetime average from the daily snapshot (M11, trust-v1.yaml RATE-02); null below 5 ratings' }
        comfort: { $ref: '#/components/schemas/ComfortPreferences' }
    Timeline:
      type: object
      description: One timestamp per reached state (RIDE-02)
      required: [requestedAt]
      properties:
        requestedAt: { type: string, format: date-time }
        offeringAt: { type: [string, 'null'], format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        driverArrivedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        noDriverFoundAt: { type: [string, 'null'], format: date-time }
    Ride:
      type: object
      description: >
        One ride as its rider OR its driver sees it — `driver` is set only for the rider view
        (from acceptance), `rider` only for the driver view.
      required: [id, state, kind, regionId, serviceTypeId, serviceTypeNameEn, serviceTypeNameAr,
                 pickup, destination, stops, paymentMethod, surgeMultiplier, surchargePercent,
                 estimate, timeline]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RideState' }
        kind: { type: string, enum: [on_demand, scheduled, shared] }
        scheduled:
          type: [object, 'null']
          description: 'M12 — kind `scheduled` only: scheduled-shared-v1 `ScheduledInfo`'
        shared:
          type: [object, 'null']
          description: 'M12 — kind `shared` only: scheduled-shared-v1 `SharedInfo`'
        regionId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        serviceTypeNameEn: { type: string }
        serviceTypeNameAr: { type: string }
        pickup: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        stops:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Place' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        pickupDistanceMode: { $ref: '#/components/schemas/PickupDistanceMode' }
        surgeMultiplier: { type: number, description: Locked at request }
        surchargePercent: { type: number, description: Locked at request }
        estimate: { $ref: '#/components/schemas/Estimate' }
        timeline: { $ref: '#/components/schemas/Timeline' }
        cancellationGraceEndsAt: { type: [string, 'null'], format: date-time }
        waitGraceEndsAt:
          type: [string, 'null']
          format: date-time
          description: driverArrivedAt + region wait grace (UC-R-05 step 4; charges from M8)
        cancellationReason:
          type: [string, 'null']
          enum: [changed_mind, driver_too_far, wrong_pickup, rider_no_show, vehicle_issue,
                 unsafe_pickup, other, account_suspended, shared_expired, rider_busy, null]
          description: >
            `account_suspended` (M11 review ruling 2026-10-16) = the system cancelled a
            pre-acceptance request because an admin suspended the rider's whole account (no fee);
            never chosen by a party. `shared_expired` (M12) = the system cancelled a "when full"
            shared ride left unfilled for 24 h (no fee); `rider_busy` (M12 ruling 2026-10-16) = the
            system cancelled a scheduled ride because its rider was on another live ride at the
            conversion/fallback moment (no fee)
        cancellationFee: { type: [number, 'null'], description: Recorded fee — collected by the M8 money rails (money-v1.yaml rider dues) }
        fare:
          oneOf:
            - { $ref: '#/components/schemas/FinalFare' }
            - { type: 'null' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        walletApplied: { type: [number, 'null'], description: 'M8 (PAY-02): wallet part of the FARE (null on cash-method rides)' }
        cashDue:
          type: [number, 'null']
          description: >
            M8 (PAY-02): the cash the driver collects = the fare's cash part + every CASH carried
            due of this ride (earmarked or collected), shown to both. null when a wallet ride owes
            nothing in cash, and on a cash-method ride without a cash carried due (the cash is
            then the fare total).
        carriedDues:
          type: array
          description: >
            M8 (H3): the rider dues this ride carries, itemized; never null (`[]` when none). A
            released (mark-unpaid) due is not listed. Rider view, driver views (active, detail,
            completion response) and the admin ride detail.
          items: { $ref: '#/components/schemas/CarriedDue' }
        tip:
          type: [number, 'null']
          description: >
            M8 (PAY-04): outside the fare total. Reported whenever the ride has a tip, whatever
            its payment status: a tip given during `in_progress` already shows (walletApplied /
            cashDue stay null and carriedDues `[]` until completion). null when none.
        driverStream: { type: [string, 'null'], enum: [ok, lost, null], description: 'TRK-04, accepted..in_progress' }
        driverPosition:
          description: Latest known driver position (rider view, accepted..in_progress)
          oneOf:
            - { $ref: '#/components/schemas/LatLng' }
            - { type: 'null' }
        etaSeconds: { type: [integer, 'null'] }
        retryOfRideId: { type: [string, 'null'], format: uuid }
        redispatchOfRideId: { type: [string, 'null'], format: uuid }
        redispatchedAsRideId:
          type: [string, 'null']
          format: uuid
          description: Rider view of a `cancelled_by_driver` ride — the new ride dispatched for them
        driver:
          oneOf:
            - { $ref: '#/components/schemas/DriverSummary' }
            - { type: 'null' }
        rider:
          oneOf:
            - { $ref: '#/components/schemas/RiderSummary' }
            - { type: 'null' }
        myRating:
          description: >
            M11 (RATE-01): the caller's own rating state for this ride — rider and driver views,
            history included; `MyRating` in trust-v1.yaml. Absent in admin views.
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [pending, submitted, expired, not_applicable] }
            windowEndsAt: { type: [string, 'null'], format: date-time }
            score: { type: [integer, 'null'] }
    FinalFare:
      type: object
      description: The stored fare (fares row) — never recomputed (PRC-04)
      required: [distanceMeters, durationSeconds, components]
      properties:
        distanceMeters: { type: integer, description: Measured from the in_ride trace }
        durationSeconds: { type: integer }
        components: { $ref: '#/components/schemas/FareComponents' }
    RideOffer:
      type: object
      description: UC-D-06 offer card
      required: [id, rideId, expiresAt, pickup, pickupDistanceMeters, pickupEtaSeconds,
                 destination, stops, serviceTypeNameEn, serviceTypeNameAr, estimatedFare,
                 currency, surge, paymentMethod, rider]
      properties:
        id: { type: string, format: uuid }
        rideId: { type: string, format: uuid }
        offeredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: offeredAt + 15 s }
        pickup: { $ref: '#/components/schemas/Place' }
        pickupDistanceMeters: { type: integer }
        pickupEtaSeconds: { type: integer }
        destination: { $ref: '#/components/schemas/Place' }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Place' }
        serviceTypeNameEn: { type: string }
        serviceTypeNameAr: { type: string }
        estimatedFare: { type: number }
        currency: { type: string }
        surge: { type: boolean, description: Surge flag (multiplier > 1.0) }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        rider: { $ref: '#/components/schemas/RiderSummary' }
        shared:
          type: [object, 'null']
          description: 'M12 — shared rides only: scheduled-shared-v1 `SharedOfferInfo` (seats, parties)'
    CancellationQuote:
      type: object
      required: [free]
      properties:
        free: { type: boolean }
        fee: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        graceEndsAt: { type: [string, 'null'], format: date-time, description: When free cancellation ends (if it has not yet) }
    RiderCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [changed_mind, driver_too_far, wrong_pickup, other] }
        note: { type: string, maxLength: 500, description: Required for `other` }
    DriverCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [rider_no_show, vehicle_issue, unsafe_pickup, other] }
        note: { type: string, maxLength: 500, description: Required for `other` }
    GeofenceError:
      type: object
      required: [status, message, code, details]
      properties:
        status: { type: integer }
        message: { type: string }
        code: { type: string, enum: [outside_geofence, no_position] }
        details:
          type: object
          required: [geofenceMeters]
          properties:
            distanceMeters: { type: [integer, 'null'], description: Distance to pickup (UC-D-07 E1 hint); null for no_position }
            geofenceMeters: { type: integer }
    TracePoint:
      type: object
      required: [lat, lng, recordedAt, phase]
      properties:
        lat: { type: number }
        lng: { type: number }
        recordedAt: { type: string, format: date-time }
        phase: { type: string, enum: [to_pickup, in_ride] }
    CarriedDue:
      type: object
      description: >
        A rider due (money-v1 RiderDue — a cancelled ride's fee) carried by this completed ride.
        `method: wallet` = taken from the rider's wallet at completion, always `collected`;
        `method: cash` = collected via the driver: `earmarked` while the ride's payment is
        `pending`, `collected` after cash-confirm. Its currency always equals the ride's.
      required: [dueId, sourceRideId, amount, currency, method, status]
      properties:
        dueId: { type: string, format: uuid }
        sourceRideId: { type: string, format: uuid, description: The cancelled ride the fee came from }
        amount: { type: number, description: 2 dp, in `currency` }
        currency: { type: string }
        method: { type: string, enum: [wallet, cash] }
        status: { type: string, enum: [earmarked, collected] }
    Receipt:
      type: object
      description: UC-R-07 step 4 — route map from the trace, timestamps, stored breakdown
      required: [rideId, regionId, serviceTypeNameEn, serviceTypeNameAr, pickup, destination,
                 stops, timeline, fare, paymentMethod, paymentStatus, route]
      properties:
        rideId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        serviceTypeNameEn: { type: string }
        serviceTypeNameAr: { type: string }
        pickup: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Place' }
        timeline: { $ref: '#/components/schemas/Timeline' }
        fare: { $ref: '#/components/schemas/FinalFare' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        walletApplied: { type: [number, 'null'], description: 'M8 (PAY-02): wallet part of the fare' }
        cashDue: { type: [number, 'null'], description: 'M8 (PAY-02): as on Ride — fare cash part + cash carried dues' }
        carriedDues:
          type: array
          description: M8 (H3) — as on Ride; never null
          items: { $ref: '#/components/schemas/CarriedDue' }
        tip: { type: [number, 'null'], description: 'M8 (PAY-04): its own receipt line, outside the fare total' }
        driver: { $ref: '#/components/schemas/DriverSummary' }
        route:
          type: object
          description: 'GeoJSON LineString of the in_ride trace, [lng, lat]'
    RideSummary:
      type: object
      required: [id, state, requestedAt, pickup, destination, serviceTypeNameEn, serviceTypeNameAr]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RideState' }
        requestedAt: { type: string, format: date-time }
        pickup: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        serviceTypeNameEn: { type: string }
        serviceTypeNameAr: { type: string }
        total: { type: [number, 'null'], description: Fare total when completed }
        cancellationFee: { type: [number, 'null'] }
        currency: { type: string }
    PartyRideSummary:
      description: >
        A rider / driver history row (`GET /rides`, `GET /driver/rides`): RideSummary plus the
        caller's side of it (M11, trust-v1.yaml). AdminRideSummary does NOT carry these fields.
      allOf:
        - { $ref: '#/components/schemas/RideSummary' }
        - type: object
          required: [myRating, counterpartFirstName, cancellationReason, kind]
          properties:
            kind:
              type: string
              enum: [on_demand, scheduled, shared]
              description: The row's ride kind (V1 conformance W41 — the history labels and filter)
            partySize:
              type: [integer, 'null']
              description: The rider's own seats on a shared ride (rider history); null otherwise
            myRating:
              description: The caller's own rating state for the ride — same object as `Ride.myRating`
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [pending, submitted, expired, not_applicable] }
                windowEndsAt: { type: [string, 'null'], format: date-time }
                score: { type: [integer, 'null'] }
            counterpartFirstName:
              type: [string, 'null']
              description: >
                The driver's first name in the rider's history, the rider's first name in the
                driver's history; null when the ride never had a driver
            cancellationReason:
              type: [string, 'null']
              enum: [changed_mind, driver_too_far, wrong_pickup, rider_no_show, vehicle_issue,
                     unsafe_pickup, other, account_suspended, shared_expired, rider_busy, null]
              description: Same as `Ride.cancellationReason`; null when not cancelled
    RideSummaryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PartyRideSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
    AdminRideSummary:
      allOf:
        - { $ref: '#/components/schemas/RideSummary' }
        - type: object
          required: [kind, regionId, regionName, riderUserId, riderName]
          properties:
            kind: { type: string, enum: [on_demand, scheduled, shared] }
            regionId: { type: string, format: uuid }
            regionName: { type: string }
            riderUserId: { type: string, format: uuid }
            riderName: { type: string }
            driverUserId: { type: [string, 'null'], format: uuid }
            driverName: { type: [string, 'null'] }
            sharedSeats:
              type: [integer, 'null']
              description: >
                Shared rides only (review V1 W15, "Shared · 3 seats"): the seats the fare was split
                over once completed, else the seats held now. Null for other kinds.
            sharedParties:
              type: [integer, 'null']
              description: >
                Shared rides only ("Nour S. + 2"): the parties riding — joined or completed
                members, the creator included. Null for other kinds.
    AdminRideSummaryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminRideSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
    OfferTrailEntry:
      type: object
      required: [offerId, sequence, driverUserId, driverName, offeredAt, expiresAt,
                 pickupDistanceMeters, pickupEtaSeconds]
      properties:
        offerId: { type: string, format: uuid }
        sequence: { type: integer }
        driverUserId: { type: string, format: uuid }
        driverName: { type: string }
        vehicleId: { type: string, format: uuid }
        offeredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        response: { type: [string, 'null'], enum: [accepted, declined, timeout, withdrawn, null] }
        respondedAt: { type: [string, 'null'], format: date-time }
        pickupDistanceMeters: { type: integer }
        pickupEtaSeconds: { type: integer }
    AdminRideDetail:
      type: object
      description: >
        UC-A-18 full truth. Chat log, payments ledger, reports/tickets/SOS join the detail when
        their milestones land (M8/M10). The related reports, support tickets, lost-item cases
        and SOS events are served by `GET /api/v1/admin/rides/{rideId}/related` (review V1 W15).
      required: [ride, riderUserId, riderName, riderPhone, offers, trace]
      properties:
        ride: { $ref: '#/components/schemas/Ride' }
        riderUserId: { type: string, format: uuid }
        riderName: { type: string }
        riderPhone: { type: [string, 'null'], description: 'Contact access (UC-A-20, owner 2026-10-14) — null unless the caller holds `support:handle`; same for driverPhone' }
        driverUserId: { type: [string, 'null'], format: uuid }
        driverName: { type: [string, 'null'] }
        driverPhone: { type: [string, 'null'] }
        vehicleId: { type: [string, 'null'], format: uuid }
        cancellationNote: { type: [string, 'null'] }
        offers:
          type: array
          description: The dispatch trail in candidate order
          items: { $ref: '#/components/schemas/OfferTrailEntry' }
        trace:
          type: array
          description: Every stored GPS point, both phases, in recordedAt order (TRK-03)
          items: { $ref: '#/components/schemas/TracePoint' }
    AdminRelatedParty:
      type: object
      required: [userId, name, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [rider, driver], description: The side they acted on (filed / opened from / raised as) }
    AdminRideRelated:
      type: object
      description: >
        Review V1 W15 (UC-A-18 "related reports/tickets/SOS"). Each section is present ONLY when
        the caller holds the permission that guards that data elsewhere, and absent from the JSON
        otherwise: `reports` needs `reports:view`; `tickets`, `lostItems` and `sos` need
        `support:view`. A present section may be empty. Lists are newest first. `ref` = the id's
        first 8 hex digits upper-case (the apps add their own prefix, e.g. T- / L-). Ids are
        link-ready: a report opens at the admin report detail, a ticket or lost-item case at the
        admin ticket detail. No phone is served.
      required: [rideId]
      properties:
        rideId: { type: string, format: uuid }
        reports:
          type: array
          items:
            type: object
            required: [id, ref, category, status, reporter, reported, createdAt]
            properties:
              id: { type: string, format: uuid }
              ref: { type: string }
              category: { type: string, description: trust-v1 ReportCategory }
              status: { type: string, enum: [open, substantiated, unsubstantiated] }
              reporter: { $ref: '#/components/schemas/AdminRelatedParty' }
              reported: { $ref: '#/components/schemas/AdminRelatedParty' }
              createdAt: { type: string, format: date-time }
        tickets:
          type: array
          description: Support tickets about the ride (kind `ticket`), SOS-linked ones included
          items:
            type: object
            required: [id, ref, categoryId, categoryNameEn, categoryNameAr, summary, status, priority, user, createdAt]
            properties:
              id: { type: string, format: uuid }
              ref: { type: string }
              categoryId: { type: string, format: uuid }
              categoryNameEn: { type: string }
              categoryNameAr: { type: string }
              summary: { type: string, description: "The description's first line, at most 120 characters (ellipsis when cut)" }
              status: { type: string, description: support-v1 TicketStatus }
              priority: { type: string, description: support-v1 TicketPriority }
              user: { $ref: '#/components/schemas/AdminRelatedParty' }
              sosEventId: { type: [string, 'null'], format: uuid }
              createdAt: { type: string, format: date-time }
        lostItems:
          type: array
          description: Lost-item cases of the ride (support tickets of kind `lost_item`)
          items:
            type: object
            required: [id, ref, summary, caseStatus, status, user, createdAt]
            properties:
              id: { type: string, format: uuid }
              ref: { type: string }
              summary: { type: string }
              caseStatus: { type: string, description: support-v1 CaseStatus }
              status: { type: string, description: support-v1 TicketStatus }
              user: { $ref: '#/components/schemas/AdminRelatedParty' }
              createdAt: { type: string, format: date-time }
        sos:
          type: array
          items:
            type: object
            required: [id, ref, triggeredBy, triggeredAt, acknowledged]
            properties:
              id: { type: string, format: uuid }
              ref: { type: string }
              triggeredBy: { $ref: '#/components/schemas/AdminRelatedParty' }
              triggeredAt: { type: string, format: date-time }
              acknowledged: { type: boolean }
              acknowledgedAt: { type: [string, 'null'], format: date-time }
              ticketId: { type: [string, 'null'], format: uuid, description: The SOS-linked support ticket }
