spring:
  application:
    name: ${SPRING_APPLICATION_NAME:labby-backend}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labby}
    username: ${DB_USERNAME:labby}
    password: ${DB_PASSWORD:labby}
  jpa:
    # Flyway owns the schema; Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: ${ACTUATOR_HEALTH_PROBES_ENABLED:true}

springdoc:
  # Scan only the controller package; everything else never shows up in the API docs.
  packages-to-scan: com.labby.backend.controller
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.labby.backend: ${LOG_LEVEL_APP:INFO}

labby:
  cors:
    # Comma-separated browser origins allowed to call /api/** (admin dashboard).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # HS256 signing secret; must be >= 32 bytes (NFR-S1). Never commit a real value.
    # No default on purpose: a usable fallback would be a repo-committed signing secret.
    # Boot fails fast when JWT_SECRET is unset (dev values live in .env, never committed).
    jwt-secret: ${JWT_SECRET}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
    # Per phone+IP failed-login throttling (NFR-S3).
    login-max-attempts: ${LOGIN_THROTTLE_MAX_ATTEMPTS:10}
    login-window-seconds: ${LOGIN_THROTTLE_WINDOW_SECONDS:900}
  otp:
    # AUTH-04 policy values.
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-per-phone-per-hour: ${OTP_MAX_PER_PHONE_PER_HOUR:5}
  sms:
    # Owner-operated Traccar SMS Gateway (ES-01); all environments send real SMS.
    gateway-url: ${SMS_GATEWAY_URL:https://www.traccar.org/sms/}
    gateway-token: ${SMS_GATEWAY_TOKEN:change-me}
  storage:
    # Private upload root (NFR-S2); photos are served only through authenticated endpoints.
    dir: ${STORAGE_DIR:./data/uploads}
    photo-max-bytes: ${STORAGE_PHOTO_MAX_BYTES:5242880}
    # Driver documents (image or PDF) and vehicle photos (M5).
    driver-file-max-bytes: ${STORAGE_DRIVER_FILE_MAX_BYTES:10485760}
    # Lifetime of expiring file-access URLs minted for permission-checked viewers (NFR-S2).
    url-ttl-seconds: ${STORAGE_URL_TTL_SECONDS:300}
    # Uploads one user may make to /driver/files per rolling 24 h (429 beyond it).
    driver-file-daily-cap: ${STORAGE_DRIVER_FILE_DAILY_CAP:50}
    # Nightly cleanup of uploads no document / vehicle photo references, older than the retention.
    # Spring cron (second minute hour day month weekday), operating timezone; "-" disables it.
    orphan-file-retention-days: ${STORAGE_ORPHAN_FILE_RETENTION_DAYS:7}
    orphan-cleanup-cron: ${STORAGE_ORPHAN_CLEANUP_CRON:0 30 3 * * *}
  onboarding:
    # Operating timezone: its calendar date is "today" for document expiry (DRV-04) — a document
    # is valid THROUGH its expiry date. Launch market: Syria.
    timezone: ${ONBOARDING_TIMEZONE:Asia/Damascus}
    # Daily document-expiry job (30/7-day reminders, auto-suspension), evaluated in the timezone
    # above. Spring cron (second minute hour day month weekday); "-" disables it.
    expiry-job-cron: ${ONBOARDING_EXPIRY_JOB_CRON:0 5 0 * * *}
  notifications:
    # Outbox dispatcher (NTF-01..03): renders queued events into the notification center and
    # pushes them via FCM. Spring cron (second minute hour day month weekday); "-" disables it.
    dispatch-cron: ${NOTIFICATIONS_DISPATCH_CRON:*/5 * * * * *}
    # Firebase service account (ES-03) — env only, never committed. Set ONE of the two; when both
    # are empty pushes are logged instead of sent (dev/tests), the center still records everything.
    firebase-credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    firebase-credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  tracking:
    # Driver GPS streaming (TRK-01): clients send a sample this often while online.
    stream-interval-seconds: ${LOCATION_INTERVAL_SECONDS:5}
    # A driver whose last sample is older than this is stale: no new offers (TRK-04).
    stale-after-seconds: ${LOCATION_STALE_SECONDS:30}
  realtime:
    # WebSocket /api/v1/realtime (realtime-v1.yaml): the first-frame auth deadline and the idle
    # close, both from the contract; the check interval bounds how fast token expiry, session
    # revocation and idleness are noticed.
    auth-timeout-seconds: ${REALTIME_AUTH_TIMEOUT_SECONDS:10}
    idle-timeout-seconds: ${REALTIME_IDLE_TIMEOUT_SECONDS:60}
    check-interval-seconds: ${REALTIME_CHECK_INTERVAL_SECONDS:5}
  rides:
    # On-demand ride loop (rides-v1.yaml, SRS §9 defaults). Offer window and dispatch give-up
    # (RIDE-03), the "Arrived" geofence (RIDE-04), and how many nearest eligible drivers are
    # ranked by routed pickup ETA for each offer.
    offer-seconds: ${DISPATCH_OFFER_SECONDS:15}
    give-up-minutes: ${DISPATCH_GIVE_UP_MINUTES:10}
    arrive-geofence-meters: ${ARRIVE_GEOFENCE_METERS:100}
    candidate-pool-size: ${DISPATCH_CANDIDATE_POOL_SIZE:5}
    # Rider-facing ETA refresh (TRK-02): at most this often per ride.
    eta-refresh-seconds: ${RIDE_ETA_REFRESH_SECONDS:30}
    # Dispatcher tick (expired offers -> next candidate, give-up) and ride monitor tick (driver
    # stream lost/back, ETA refresh). Spring cron; "-" disables.
    dispatch-cron: ${DISPATCH_CRON:* * * * * *}
    monitor-cron: ${RIDE_MONITOR_CRON:*/5 * * * * *}
  ridesim:
    # Dev driver-simulation harness (M7-T5, dev profile only): the listed seeded drivers go
    # online, stream, accept offers and drive their rides along real routes so the loop runs
    # without physical devices. Off unless RIDE_SIM_ENABLED=true.
    enabled: ${RIDE_SIM_ENABLED:false}
    tick-ms: ${RIDE_SIM_TICK_MS:1000}
    speed-kmh: ${RIDE_SIM_SPEED_KMH:40}
    accept-delay-ticks: ${RIDE_SIM_ACCEPT_DELAY_TICKS:2}
    dwell-ticks: ${RIDE_SIM_DWELL_TICKS:3}
    phones: ${RIDE_SIM_DRIVERS:+963900000006,+963900000007}
    # Where idle sim drivers wait (inside the demo Damascus region).
    center-lat: ${RIDE_SIM_CENTER_LAT:33.515}
    center-lng: ${RIDE_SIM_CENTER_LNG:36.28}
  money:
    # M8 money rails (money-v1.yaml). A driver balance within this much above the region floor is
    # status "warning" (COM-03); the weekly commission recalc runs on this Spring cron (operating
    # timezone — weeks themselves are computed per region time zone; "-" disables, COM-02). A
    # completion computes a missing week rate itself, so the job only pre-warms the rows.
    floor-warning-margin: ${MONEY_FLOOR_WARNING_MARGIN:10}
    commission-recalc-cron: ${MONEY_COMMISSION_RECALC_CRON:0 10 0 * * MON}
  routing:
    # RoutingProvider (ES-04): public OSRM demo server in V1; self-hosted OSRM is a config change.
    osrm-url: ${ROUTING_OSRM_URL:https://router.project-osrm.org}
    osrm-timeout-seconds: ${ROUTING_OSRM_TIMEOUT_SECONDS:3}
    # Straight-line fallback when OSRM is unreachable (NFR-A3): great-circle distance x factor at
    # this speed, flagged approximate.
    fallback-detour-factor: ${ROUTING_FALLBACK_DETOUR_FACTOR:1.3}
    fallback-speed-kmh: ${ROUTING_FALLBACK_SPEED_KMH:25}
