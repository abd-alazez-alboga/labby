# Local development dependencies for the Labby backend.
# Credentials/ports come from the environment (see .env.example); defaults match it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: labby-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-labby}
      POSTGRES_USER: ${DB_USERNAME:-labby}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-labby}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - labby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-labby} -d ${DB_NAME:-labby}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  labby-postgres-data:
